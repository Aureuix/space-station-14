name: Check PR Target Branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-target-branch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if PR targets starlight-dev
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "PR from: $SOURCE_BRANCH -> $TARGET_BRANCH"
          
          # Allow starlight-dev to starlight PRs in both directions # SpL- moved to suit
          if [[ ("$SOURCE_BRANCH" == "SpectaLight" && "$TARGET_BRANCH" == "SpectaLight") || 
                ("$SOURCE_BRANCH" == "SpectaLight" && "$TARGET_BRANCH" == "SpectaLight") ]]; then
            echo "Allowed: PR between SpectaLight and SpL branches"
            exit 0
          fi
          
          # For all other PRs, require starlight-dev as target
          if [ "$TARGET_BRANCH" != "SpectaLight" ]; then
            echo "Error: PR must target 'SpectaLight' branch, but targets '$TARGET_BRANCH'"
            echo "Please change the target branch to 'SpectaLight'"
            exit 1
          else
            echo "Success: PR correctly targets 'SpectaLight' branch"
          fi
