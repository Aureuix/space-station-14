# As opposed to MagazineBox these are boxes of magazines so BoxMagazine
# CaselessRifle
- type: entity
  name: box of magazines
  parent: BoxCardboard
  id: BoxMagazine
  description: A box full of magazines.
  components:
  - type: Sprite
    layers:
      - state: box_security
      - state: magazine

- type: entity
  name: box of 5.7mm magazines
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRifle
  description: A box full of 5.7mm magazines.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MagazinePistolCaselessRifle
        amount: 4

- type: entity
  name: box of 5.7mm (practice) magazines
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRiflePractice
  description: A box full of 5.7mm practice magazines.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MagazinePistolCaselessRiflePractice
        amount: 4

# LightRifle
- type: entity
  name: box of 7.62x51mm magazines # Spectralight: .30 -> 7.62x51mm
  parent: BoxMagazine
  id: BoxMagazineLightRifle
  description: A box full of 7.62x51mm magazines. # Spectralight: .30 -> 7.62x51mm
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MagazineLightRifleSP
          amount: 1
        - id: MagazineLightRifleHP
          amount: 1
        - id: MagazineLightRifleFMJ
          amount: 1
        - id: MagazineLightRifleAP
          amount: 1

- type: entity
  name: box of 7.62x51mm (practice) magazines # Spectralight: .30 -> 7.62x51mm
  parent: BoxMagazine
  id: BoxMagazineLightRiflePractice
  description: A box full of 7.62x51mm (practice) magazines. # Spectralight: .30 -> 7.62x51mm
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MagazineLightRiflePractice
        amount: 4

