# Rifle
- type: entity
  name: box of 5.56x45mm magazines # Spectralight: .20 -> 5.56x45mm
  parent: BoxMagazine
  id: BoxMagazineRifleSP
  description: A box full of 5.56x45mm magazines. # Spectralight: .20 -> 5.56x45mm
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,2,3
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MagazineRifleFMJ
          amount: 2
        - id: MagazineRifleSP
          amount: 1
        - id: MagazineRifleHP
          amount: 1
        - id: MagazineRifleAP
          amount: 1

