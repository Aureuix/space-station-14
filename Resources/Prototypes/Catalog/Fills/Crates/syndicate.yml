- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSurplusBundle
  name: syndicate surplus crate
  description: Contains 50 telecrystals worth of completely random Syndicate items. It can be useless junk or really good.
  components:
    - type: SurplusBundle
      totalPrice: 50

- type: entity
  parent: CrateSyndicate
  id: CrateCybersunJuggernautBundle
  name: cybersun juggernaut bundle
  suffix: Filled
  description: Contains everything except a big gun to go postal.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitJuggernaut
        - !type:NestedSelector
          tableId: SyndicateHardsuitExtrasEntityTable

- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSuperSurplusBundle
  name: syndicate super surplus crate
  description: Contains 125 telecrystals worth of completely random Syndicate items.
  components:
    - type: SurplusBundle
      totalPrice: 125

- type: entity
  id: CrateCybersunDarkGygaxBundle
  suffix: Filled
  parent: CrateSyndicate
  name: cybersun gygax bundle
  description: Contains a CyberSun light mech. Open when ready– it can't be closed again after.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MechGygaxSyndieFilled
        - id: DoubleEmergencyOxygenTankFilled
        - id: DoubleEmergencyNitrogenTankFilled
        - id: EmergencyCoolingUnit # Starlight
        - id: ToolboxSyndicateFilled
        - id: PlushieNuke

- type: entity
  id: CrateCybersunMaulerBundle
  suffix: Filled
  parent: CrateSyndicate
  name: cybersun mauler bundle
  description: Contains a CyberSun heavy mech. Open when ready– it can't be closed again after.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MechMaulerSyndieFilled
        - id: DoubleEmergencyOxygenTankFilled
        - id: DoubleEmergencyNitrogenTankFilled
        - id: EmergencyCoolingUnit # Starlight
        - id: ToolboxSyndicateFilled
        - id: PlushieNuke
