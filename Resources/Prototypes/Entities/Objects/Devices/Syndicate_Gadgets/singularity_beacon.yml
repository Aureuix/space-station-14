- type: entity
  id: SingularityBeacon
  parent: [BaseMachinePowered, BaseSyndicateContraband]
  name: redspace calibration beacon # SpL
  description: A Syndicate device that enables redspace tracking and delivery on a pinpoint scale. Also has the secondary effect of attracting nearby gravitational singularities.
  components:
  - type: Sprite
    sprite: Objects/Devices/singularity_beacon.rsi
    layers:
    - state: icon
  - type: Item
    size: Huge
  - type: MultiHandedItem #huge device
  - type: HeldSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        density: 80
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: SingularityAttractor
    baseRange: 80
  - type: SinguloFood
    energy: 120
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ApcPowerReceiver
    powerLoad: 8000 # SpL 5k->8k
  - type: StaticPrice
    price: 7500
