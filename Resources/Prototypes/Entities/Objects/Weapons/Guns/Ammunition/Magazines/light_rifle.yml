# Empty mags
- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseMagazineLightRifle
  name: "7.62x51mm magazine" # Spectralight: .30 -> 7.62x51mm
  components:
  - type: Tag
    tags:
      - MagazineLightRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeLightRifle
    proto: CartridgeLightRifleSP
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleBoxSP
  name: "7.62x51mm box magazine (SP)" # Spectralight: .30 -> 7.62x51mm
  description: Box containing a 100-round belt of linked 7.62x51mm rounds, used by light machine guns such as the L6. Intended to hold general-purpose kinetic ammunition. # Spectralight: .30 -> 7.62x51mm
  components:
  - type: Tag
    tags:
      - MagazineLightRifleBox
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleSP
    capacity: 100
  - type: Item
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleSP
  name: "7.62x51mm magazine (SP)" # Spectralight: .30 -> 7.62x51mm
