- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecuritySalvageContraband ] # Starlight-edit - Security -> SecuritySalvage
  id: BaseCartridgeMagnum
  name: .45 ACP cartridge  # Spectralight: Magnum -> ACP
  description: A small but powerful cartridge, commonly seen used by revolvers and heavy pistols. # SpL
  components:
  - type: Tag
    tags:
      - CartridgeMagnum
  - type: CartridgeAmmo
    proto: BulletMagnumTraceSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnumSP
  name: .45 ACP cartridge (SP) # Spectralight: Magnum -> ACP
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

