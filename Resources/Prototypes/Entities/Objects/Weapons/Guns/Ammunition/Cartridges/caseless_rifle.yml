- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeCaselessRifle
  description: A small caliber utilizing caseless technology, omitting conventional brass casing in favor of hardened propellant.
  name: 5.7mm cartridge
  components:
  - type: Tag
    tags:
      - CartridgeCaselessRifle
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifle
  name: 5.7mm cartridge
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRifleTrace

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRiflePractice
  name: 5.7mm cartridge (practice)
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRiflePracticeTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"
