- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgePistol
  name: cartridge (9mm) # Spectralight: .35 -> 9mm
  description: An incredibly versatile cartridge used by all manner of firearms, and arguably the most popular caliber available. # SpL
  components:
  - type: Tag
    tags:
      - CartridgePistol
  - type: CartridgeAmmo
    proto: BulletPistolTraceSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolSP
  name: cartridge (9mm SP) # Spectralight: .35 -> 9mm
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

