- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeRifle
  name: cartridge (5.56x45mm) # Spectralight: .20 -> 5.56x45mm
  description: A modern intermediate cartridge used commonly by assault rifles.
  components:
  - type: Tag
    tags:
      - CartridgeRifle
  - type: CartridgeAmmo
    proto: BulletRifleTrace
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleSP
  name: 5.56x45mm cartridge (SP) # Spectralight: .20 -> 5.56x45mm
  components:
  - type: CartridgeAmmo
    proto: BulletRifleTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

