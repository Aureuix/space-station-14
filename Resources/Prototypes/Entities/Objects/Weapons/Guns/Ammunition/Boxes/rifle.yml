- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxRifle
  description: A cardboard box containing 50 intermediate rifle cartridges.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle
    proto: CartridgeRifleSP
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRifleBig
  name: 5.56x45mm ammunition box (SP) # Spectralight: .20 -> 5.56x45mm
  description: A robust metal box containing 200 intermediate rifle cartridges. For the romantic gunman. # SpL
  components:
  - type: BallisticAmmoProvider
    capacity: 200
    proto: CartridgeRifleSP
  - type: Sprite
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
    - state: magb-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: magb
    steps: 4
    zeroVisible: false
  - type: Appearance

