- type: entity
  name: chemistry bag
  id: ChemBag
  parent: BaseStorageItem
  description: A bag for storing chemistry products, such as pills, pill canisters, bottles, and syringes.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Chemistry/chem_bag.rsi
    state: icon
  - type: Clothing
    sprite: _Starlight/Objects/Specific/Chemistry/chem_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal # allow up to 5 large beakers / 10 beakers / 10 pill canisters
    grid:
    - 0,0,4,3
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
        # - FitsInDispenser
        - Pill
        - Patch
        - HandLabeler # SpL- might as well right?
        - SolutionScanner # SpL- yes this includes shit like the bso hud. I'm sure it's fine. chemist antags eat your hearts out
      tags:
        - Document
        - PillCanister
        - Bottle
        - Syringe
        - Dropper
        - PillCanister # SpL
        - PatchPack # SpL
        - Bottle # SpL
        - Vial # SpL
        - GlassBeaker # SpL
        - ChemDispensable # SpL
  - type: Dumpable
