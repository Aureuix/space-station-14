# Uplinks
- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: BaseUplinkRadio
  name: syndicate uplink
  description: Suspiciously looking old radio...
  suffix: Empty
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: old-radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 0
      
- type: entity
  parent: [BaseUplinkRadio, StorePresetUplink]
  id: BaseUplinkRadioPreset

- type: entity
  parent: BaseUplinkRadioPreset
  id: BaseUplinkRadio20TC
  suffix: 20 TC
  components:
  - type: Store
    balance:
      Telecrystal: 20

- type: entity
  parent: BaseUplinkRadioPreset
  id: BaseUplinkRadio25TC
  suffix: 25 TC
  components:
  - type: Store
    balance:
      Telecrystal: 25

#this uplink MUST be used for nukeops, as it has the tag for filtering the listing.
- type: entity
  parent: BaseUplinkRadioPreset
  id: BaseUplinkRadio40TC
  suffix: 40 TC, NukeOps
  components:
  - type: Store
    balance:
      Telecrystal: 40
  - type: Tag
    tags:
    - NukeOpsUplink

- type: entity
  parent: BaseUplinkRadioPreset
  id: BaseUplinkRadio60TC
  suffix: 60 TC, LoneOps
  components:
  - type: Store
    balance:
      Telecrystal: 60
  - type: Tag
    tags:
    - NukeOpsUplink
    - LoneOpsUplink

- type: entity
  parent: BaseUplinkRadioPreset
  id: BaseUplinkRadioDebug
  suffix: DEBUG
  components:
  - type: Store
    balance:
      Telecrystal: 99999

# SpL start
- type: entity
  parent: BaseUplinkRadioPreset
  id: BaseUplinkRadioDebugNukeops
  suffix: DEBUG, NukeOps
  components:
    - type: Tag
      tags:
        - NukeOpsUplink
    - type: Store
      balance:
        Telecrystal: 99999
# SpL end