# SpL- Honestly, just assume everything's been edited at some point. This whole file has SpL prints over it

# SpL start
- type: entity
  abstract: true
  parent: [BaseItem, BaseSyndicateContraband]
  id: BaseTelecrystal
  name: telecrystal
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
    - type: Sprite
      sprite: Objects/Specific/Syndicate/telecrystal.rsi
    - type: Item
      sprite: Objects/Specific/Syndicate/telecrystal.rsi
      size: Tiny
    - type: StackLayerThreshold
      thresholds: [ 1, 15, 30 ] # SpL end
    - type: StaticPrice
      price: 0
    - type: Appearance
    - type: StackPrice
      price: 200
    - type: Currency
      price:
        Telecrystal: 1
# SpL end

- type: entity
  name: telecrystal
  parent: BaseTelecrystal
  id: Telecrystal
  suffix: 20 TC
  components:
  - type: Sprite
    state: telecrystal_3 # SpL start
    layers:
    - state: telecrystal_3
      map: [ "base" ] # SpL end
  - type: Stack
    count: 20
    stackType: Telecrystal
    baseLayer: base # SpL start
    layerStates:
      - telecrystal_1
      - telecrystal_2
      - telecrystal_3
    layerFunction: Threshold

- type: entity
  parent: Telecrystal
  id: Telecrystal1
  suffix: 1 TC
  components:
  - type: Sprite
    state: telecrystal
  - type: Stack
    count: 1
    stackType: Telecrystal

