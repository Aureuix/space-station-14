- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: /Audio/Misc/bluealert.ogg
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: /Audio/Misc/notice1.ogg
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/Misc/notice1.ogg
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: /Audio/Misc/redalert.ogg
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound:
        path: /Audio/Misc/gamma.ogg
        params:
          volume: -2
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
      dimmedLightMultiplier: 0.7 # SpL- it's kinda neat
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound:
        path: /Audio/Misc/delta.ogg
        params:
          volume: -3
      disableSelection: true
      color: DarkRed
      emergencyLightColor: '#ffba9c' #Starlight
      forceEnableEmergencyLights: true
      shuttleTime: 180 # SpL- why would we try to make it harder to evacuate a nuke??? won't make a difference unless it's called frame 1 anyway
      dimmedLightMultiplier: 0.3 # SpL- still very dark on 0.2 so we're upping it slightly
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound:
        path: /Audio/Misc/epsilon.ogg
        params:
          volume: -2
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: '#938aff' #Starlight
      forceEnableEmergencyLights: true
      shuttleTime: 300 #SpL- epsilon's change makes it more logical to make the shuttle come faster rather than slower
      dimmedLightMultiplier: 0 # Starlight
    omega: # begin starlight
      announcement: alert-level-omega-announcement
      selectable: false
      sound:
        path: /Audio/_Starlight/Misc/omega_alt.ogg
        params:
          volume: -2
      disableSelection: true
      color: '#FFE4E1'
      emergencyLightColor: '#FFE4E1'
      forceEnableEmergencyLights: true
      shuttleTime: 6666 #SpL- if omega gets called, you are NOT leaving
      dimmedLightMultiplier: 0.2
    theta:
      announcement: alert-level-theta-announcement
      selectable: false
      sound:
        path: /Audio/_SpL/Misc/theta.ogg # SpL
        params:
          volume: -2
      disableSelection: true
      color: '#00059f' # SpL
      emergencyLightColor: '#00059f' # SpL
      forceEnableEmergencyLights: true
      shuttleTime: 6666 # SpL- you're not leaving
      dimmedLightMultiplier: 0 # SpL- this is our new epsilon, so...
    psi:
      announcement: alert-level-psi-announcement
      selectable: false
      sound:
        path: /Audio/_Starlight/Misc/psi.ogg
        params:
          volume: -2
      disableSelection: true
      color: "#2288ff"
      emergencyLightColor: "#2288ff"
      forceEnableEmergencyLights: true
      shuttleTime: 600 #SpL- Why the hell was this doubled? 
    orange:
      announcement: alert-level-orange-announcement
      selectable: true
      sound:
        path: /Audio/_Starlight/Misc/orange.ogg
        params:
          volume: -2
      color: "#ff8119"
      emergencyLightColor: "#ff8119"
      forceEnableEmergencyLights: true
      shuttleTime: 300 #SpL- if it's orange, people want out. we can penalize for misuse at cc
      # end starlight
    octarine: # Stellar - Cosmic Cult
      announcement: alert-level-octarine-announcement
      selectable: false
      sound: /Audio/_ST/Announcements/Alerts/code_octarine.ogg
      disableSelection: true
      color: CadetBlue
      emergencyLightColor: CadetBlue
      forceEnableEmergencyLights: true
      shuttleTime: 600
      dimmedLightMultiplier: 0.3 # SpL- same as delta. it's hype
      # start SpL
    tau:
      announcement: alert-level-tau-announcement
      selectable: false
      sound: /Audio/_SpL/Misc/tau.ogg
      disableSelection: true
      color: '#51db9e'
      emergencyLightColor: '#51db9e'
      forceEnableEmergencyLights: true
      shuttleTime: 600 # no change. if you're asking for tau, you're sticking around
      dimmedLightMultiplier: 0.7 