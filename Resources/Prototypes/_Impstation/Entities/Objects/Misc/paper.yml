- type: entity
  name: ticket
  parent: Paper
  id: FineTicket
  description: A space-glue backed fining ticket. 
  components:
    - type: Sprite
      layers:
        - state: paper
          color: "#f07575"
        - state: paper_words
          map: ["enum.PaperVisualLayers.Writing"]
          color: "#f07575"
          visible: false
        - state: paper_stamp-generic
          map: ["enum.PaperVisualLayers.Stamp"]
          visible: false
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/pop.ogg
      embedOnThrow: True
    - type: ThrowingAngle
      angle: 180 # SpL- this is way funnier
    - type: LandAtCursor
    - type: PaperVisuals
      backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
      contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
      backgroundModulate: "#f07575"
      contentImageModulate: "#f07575"
      backgroundPatchMargin: 20.0, 20.0, 20.0, 20.0 # SpL
      contentMargin: 20.0, 20.0, 20.0, 20.0 # SpL
      headerImagePath: "/Textures/_Starlight/Interface/Paper/paper_heading_fine.svg.96dpi.png"
      headerMargin: 0.0, 12.0, 0.0, 0.0 # SpL
      maxWritableArea: 200.0, 300.0
    - type: Tag
      tags:
        - Document
        - Paper
        - SecTicket
    # SpL Start
    - type: Paper
      content: "[bold]Offender:[/bold] 
                
                [form]
                
                [bold]Offense:[/bold] 
                
                [form]
                
                [bold]Fine:[/bold] 
                
                [form]
                
                
                [bold]Time:[/bold] 
      
                [datetime]
                
                [bold]Issuer:[/bold] 
                
                [signature]
                ─────────────
                
                [italic]Stamp/Signature[/italic]"
                  
    # SpL end

- type: entity
  id: TicketPad
  parent: BoxBase
  name: ticket pad
  description: A small folder of sticky-backed tickets. Fill out the receiver's name, crime, the issued fine, and then sign the ticket.
  components:
    - type: Item
      size: Small
      shape: null
    - type: Sprite
      sprite: _Starlight/Objects/Misc/bureaucracy.rsi
      state: ticket-book
    - type: Storage
      maxItemSize: Small
      grid:
        - 0,0,1,2
      whitelist:
        tags:
          - Document
    - type: Appearance
    - type: Tag
      tags:
        - Folder
        - SecTicket
    - type: StorageFill
      contents:
        - id: FineTicket
        - id: FineTicket
        - id: FineTicket
        - id: FineTicket
        - id: FineTicket
        - id: FineTicket