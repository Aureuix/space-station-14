- type: species
  id: IPC
  name: species-name-ipc
  roundStart: true
  prototype: MobIPC
  sprites: MobIPCSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobIPCMarkingLimits
  dollPrototype: MobIPCDummy
  skinColoration: Hues
  customName: true
  roundstartCyberwareCapacity: 6
  sexes:
  - Male
  - Female
  - Unsexed

- type: speciesBaseSprites
  id: MobIPCSprites
  sprites:
    Head: MobIPCHead
    Hair: MobIPCHair
    FacialHair: MobIPCHair
    Snout: MobHumanoidAnyMarking
    Chest: MobIPCTorso
    HeadTop: MobHumanoidAnyMarking
    Eyes: MobHumanoidAnyMarking
    LArm: MobIPCLArm
    RArm: MobIPCRArm
    LHand: MobIPCLHand
    RHand: MobIPCRHand
    LLeg: MobIPCLLeg
    RLeg: MobIPCRLeg
    LFoot: MobIPCLFoot
    RFoot: MobIPCRFoot
    Tail: MobHumanoidAnyMarking

- type: markingPoints
  id: MobIPCMarkingLimits
  points:
    HeadTop:
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Head:
      points: 1
      required: true
      defaultMarkings: [ MarkingStandardHead ]
    Eyes:
      points: 1
      required: true
      defaultMarkings: [ ClearEye ]
    Chest:
      points: 1
      required: true
      defaultMarkings: [ MarkingBlankChestM ]
    Legs:
      points: 4
      required: false
      defaultMarkings: [ MarkingBlankLLeg, MarkingBlankRLeg, MarkingBlankLFoot, MarkingBlankRFoot ]
      
    Arms:
      points: 4
      required: false
      defaultMarkings: [ MarkingBlankLArm, MarkingBlankRArm, MarkingBlankLHand, MarkingBlankRHand ]

- type: humanoidBaseSprite
  id: MobIPCEyes
  baseSprite:
    sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
    state: light

- type: humanoidBaseSprite
  id: MobIPCHair # This should use the Hologram shader like holopads do, but markings cannot currently be dynamically applied shaders, especially not the Hologram shader, needing inputs.
  layerAlpha: 1 # 0.9 to match the opacity of holograms. # SpL- dude.

- type: humanoidBaseSprite
  id: MobIPCAnyMarking

- type: humanoidBaseSprite
  id: MobIPCMarkingMatchSkin
  markingsMatchSkin: true

