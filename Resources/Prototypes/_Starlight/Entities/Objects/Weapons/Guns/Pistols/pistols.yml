- type: entity
  name: makeshift pistol
  parent: [BaseWeaponPistol, BaseMinorContraband]
  id: WeaponPistolMakeshiftCrafted
  description: Little more than a space eoka. Very unreliable.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Guns/Pistols/makeshift_pistol_crafted.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Guns/Pistols/makeshift_pistol_crafted.rsi
    - type: Gun
      fireRate: 5 #Each bullet is manually loaded, no reason to impose a firerate limit.
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
    - type: ChamberMagazineAmmoProvider
      soundRack:
        path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
    - type: ItemSlots
      slots:
        gun_chamber:
          name: Chamber
          startingItem: null
          priority: 1
          whitelist:
            tags:
              - CartridgePistol
              - CartridgePistolImprovised
    - type: Construction
      graph: MakeshiftPistolCraftedGraph
      node: shotgun
    - type: WeaponDismantleOnShoot
      dismantleChance: 0.20
      selfDamage:
        types:
          Blunt: 6
          Heat: 6
      items:
        - id: ModularBarrel
          launchAngle: 0
          prob: 1
        - id: ModularReceiver
          launchAngle: 90
          prob: 0.10
        - id: RifleStock
          launchAngle: 180
          prob: 0.80
    - type: ContainerFill
      containers:
        firing_pin:
          - FiringPinMakeshift
    - type: FiringPinHolder
      supportedPins: [Makeshift, GunUpgrade]

