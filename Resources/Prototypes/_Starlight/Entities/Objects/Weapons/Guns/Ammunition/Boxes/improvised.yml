- type: entity
  parent: BaseItem
  id: BaseMagazineBoxImprovised
  name: 5.56x45mm improvised ammunition box
  description: This looks suspiciously like a 5.56x45mm magazine box with a crude bullet drawing ontop. Mixing ammo is not advised. # Spectralight: .20 -> 5.56x45mm
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
        - CartridgePistolImprovised
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - CartridgeLightRifle
        - CartridgeLightRifleImprovised
        - ShellShotgun
        - ShellShotgunImprovised
    proto: null
    capacity: 40
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/improvised.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: Construction
    graph: ImprovisedMagazineBoxGraph
    node: shell
  - type: Tag
    tags:
    - ImprovisedAmmoBox

