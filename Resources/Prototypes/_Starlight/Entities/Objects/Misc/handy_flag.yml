- type: entity
  parent: [BaseItem, BaseSovietContraband]
  id: SovietDeskFlag
  name: soviet desk flag
  description: Belikov. Have you dug up my mole yet?
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/soviet_desk_flag.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Misc/soviet_desk_flag.rsi


- type: entity
  id: RevolutionaryHeldBanner
  name: revolutionary flag # SpL
  description: A towering revolutionary flag that makes you an easy target. An officer's pistol in the other hand is recommended. # SpL
  parent: [BaseItem, BaseSovietContraband]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/rev_flag.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Misc/rev_flag.rsi
    size: Ginormous
  - type: MeleeWeapon
    angle: 0 # SpL
    attackRate: 0.9
    range: 1.75 # SpL
    wideAnimationRotation: -145 # SpL
    damage:
      types:
        Blunt: 1
    animation: WeaponArcThrust # SpL
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg # SpL
    bluntStaminaDamageFactor: 2.0
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Pierce: 14 # SpL- converted to pierce a la one true flag 
  - type: StaminaDamageOnHit
    damage: 12
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: UseDelay
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1.05 # SpL
  - type: HeldSpeedModifier
    walkmodifier: 1 # SpL
    sprintModifier: 1.1 # SpL
  # - type: DamageOtherOnHit # SpL- moved into the throwing section at the bottom of the yaml
  #  damage:
  #    types:
  #      Blunt: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.1 
        Heat: 1.2 # It's a flag, it should burn. This gives it an obvious weakness/counterplay that makes sense.
    activeBlockModifier:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.2
        Heat: 1.2
      flatReductions:
        Blunt: 10
        Slash: 10
        Piercing: 6
  - type: Damageable
    damageContainer: Shield
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 200 # SpL
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 100 # SpL
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              PartRodMetal1:
                min: 1
                max: 1
              MaterialCloth1:
                min: 2
                max: 2
  - type: StaticPrice
    price: 1000
  - type: EmbeddableProjectile # SpL Start
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 45
  - type: LandAtCursor
  - type: Tag
    tags:
      - Spear
      - ScurretWearable
  - type: DamageOtherOnHit
    damage:
      types:
        Pierce: 16 # SpL End

