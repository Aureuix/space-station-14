- type: gameMap
  id: StarlightBarratry
  mapName: 'Barratry'
  mapPath: /Maps/_Starlight/Stations/Barratry.yml
  minPlayers: 40
  maxPlayers: 130
  stations:
    StarlightBarratry:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Barratry {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/emergency_raven.yml
# SpL Start
        - type: GridSpawn
          groups:
            trade: !type:GridSpawnGroup
              addComponents:
                - type: ProtectedGrid
                - type: TradeStation
              paths:
                - /Maps/Shuttles/trading_outpost.yml
            cargo_mining_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Mining_Cracker.yml
              nameGrid: false
            cargo_salvage_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Salvage_Tribute.yml
              nameGrid: false
            ruins: !type:GridSpawnGroup
              hide: true
              nameGrid: true
              minCount: 2
              maxCount: 3
              stationGrid: false
              paths:
                - /Maps/Ruins/abandoned_outpost.yml
                - /Maps/Ruins/atmos_interchange.yml
                - /Maps/Ruins/chunked_tcomms.yml
                - /Maps/Ruins/biodome_satellite.yml
                - /Maps/Ruins/derelict.yml
                - /Maps/Ruins/djstation.yml
                - /Maps/Ruins/empty_flagship.yml
                - /Maps/Ruins/hydro_outpost.yml
                - /Maps/Ruins/old_ai_sat.yml
                - /Maps/Ruins/ruined_prison_ship.yml
                - /Maps/Ruins/syndicate_dropship.yml
                - /Maps/Ruins/whiteship_ancient.yml
                - /Maps/Ruins/whiteship_bluespacejumper.yml
                - /Maps/Ruins/wrecklaimer.yml
                - /Maps/Ruins/displaced_telescience.yml
                - /Maps/_Starlight/Ruins/Salv_Sus.yml
            wrecks: !type:DungeonSpawnGroup
              minimumDistance: 150
              maximumDistance: 300
              stationGrid: false
              minCount: 16
              maxCount: 20
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
                - type: IFF
                  flags: HideLabel
                  color: "#88b0d1"
              protos:
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebris
                - ClusterAsteroid
                - SpindlyAsteroid
                - BlobAsteroid
                - SwissCheeseAsteroid
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - SwissCheeseTrash
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - ClusterMeat
                - SpindlyMeat
                - BlobAsteroidSnow
                - ClusterSnow
                - SwissCheeseSnow
                - ChunkDebrisSmall
                - ChunkDebrisSmall
            vgroid: !type:DungeonSpawnGroup
              minimumDistance: 300
              maximumDistance: 350
              nameDataset: NamesBorer
              stationGrid: false
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
              protos:
                - VGRoid
# SpL End
        - type: StationJobs
          availableJobs:
            #service
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            Janitor: [ 1, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 3, 3 ]
            #engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 3, 3 ]
            #medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 4, 4 ]
            MedicalIntern: [ 3, 3 ]
            Paramedic: [ 1, 1 ]
            Surgeon: [ 2, 2 ]  
            #science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 3, 3 ]
            Roboticist: [ 1, 1 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 5 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 4, 4 ]
            Brigmedic: [ 1, 1 ]
            #supply
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 4, 4 ]
            MailTech: [ 1, 2 ]
            MiningSpecialist: [ 3, 3 ]
            SalvageLead: [ 1, 1 ]
            #civilian
            Assistant: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Boxer: [ 2, 2]
            #silicon
            StationAi: [ 1, 1 ]
            Borg: [ 3, 3 ]
            #law
            Magistrate: [ 1, 1 ]
            IAA: [ 2, 2 ]
            #Representives
            BlueShield: [ 1, 1 ]
            NanoTrasenRepresentative: [ 1, 1 ]

