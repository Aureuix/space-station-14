# Blackstar Combat Suit
- type: entity
  parent: [ClothingOuterBaseLarge, BaseMajorContraband]
  id: ClothingOuterHardsuitBlackstar
  name: warlord combat suit
  description: A heavily armored combat suit typically issued to elite Dreadwalker operatives of the Blackstar mercenary group. Built to survive anything the frontier can throw at it.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/warlord.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/warlord.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: PressureProtection # SpL Start
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitBlackstar # SpL end
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
    staminaModifier: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHeavy
      params:
        volume: -6
        variation: 0.09
  - type: AllowSuitStorage
  - type: Tag
    tags:
    - MonkeyWearable
    - WhitelistChameleon
    - CorgiWearable
    - ScurretWearable
    - FootstepSound

# SpL- Blackstar Hardsuit Helmet
- type: entity
  parent: [ BaseMajorContraband, ClothingHeadLightParamsProfessional, ClothingHeadHelmetHardsuitSyndie ]
  id: ClothingHeadHelmetHardsuitBlackstar
  name: warlord combat helmet
  description: A protective airtight helmet integrated into the Warlord combat suit.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/Scarlet/warlordhead.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/Scarlet/warlordhead.rsi
    - type: Item
      size: Small
    - type: PointLight
      color: "#ff6666"
    - type: Pierceable
      level: HardenedMetal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
# SpL End


# Blackstar Mercenary Helmet
- type: entity
  parent: [ClothingHeadHelmetArmoredBase, BaseMajorContraband]
  id: ClothingHeadHelmetBlackstar
  name: Blackstar mercenary helmet
  description: A reinforced combat helmet issued to Dreadwalker operatives of the Blackstar mercenary group. Offers superior protection over standard mercenary gear.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/Blackmerc.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/Blackmerc.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.85
        Caustic: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: HideLayerClothing
    layers:
      Hair: HEAD

