- type: entity
  id: BaseEntityBrainImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: BrainImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: BrainImplantTranslator
  name: translator implant
  description: A surgically-installed brain implant that allows you to speak and understand Galactic Common.
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_translator
  - type: FunctionalOrgan
    comps:
    - type: IntrinsicTranslator
      spoken:
      - GalacticCommon
      understood:
      - GalacticCommon

- type: entity
  id: BrainImplantCommsExpedition
  name: expedition radio implant
  description: A surgically-installed brain implant that grants you access to the expedition radio channel, even without a headset.
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_comms_exped
  - type: FunctionalOrgan
    comps:
    - type: TelecomExempt
    - type: ActiveRadio
      channels:
      - Expedition
    - type: IntrinsicRadioReceiver
    - type: IntrinsicRadioTransmitter
      channels:
      - Expedition

- type: entity
  id: BrainImplantComms
  name: integrated radio implant
  description: A surgically-installed brain implant that grants you access to whatever radio channels you insert the encryption keys for. It has room for four keys.
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_comms
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: FunctionalOrgan
    comps:
    - type: ActiveRadio
    - type: IntrinsicRadioReceiver
    - type: IntrinsicRadioTransmitter
    - type: EncryptionKeyHolder
      keySlots: 4
      canBeExamined: false


- type: entity
  id: BrainImplantNexus
  name: Nexus uplink
  description: A surgically-installed brain implant that grants you access to the Nexus, a technological network that allows you to communicate with anyone else who also has a Nexus implant. Avali and Resomi are given this implant at birth.
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_nexus
  - type: CollectiveMindIdentity
    prototypeId: Nexus
  - type: TaggedOrgan
    addTags:
      - Nexus