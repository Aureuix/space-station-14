- type: entity
  parent: BaseGameRule
  id: CentCommSpawn
  components:
  - type: StationEvent
    minimumPlayers: 1
    duration: 1
    maxDuration: 1
  - type: AntagLoadProfileRule
    applyCharacterProfile: true
  - type: AntagSelection
    definitions:
    - spawnerPrototype: SpawnPointGhostCentcomm
      min: 1
      max: 1
      prefRoles: [ CentralCommandOperator ]
      pickPlayer: true
      roleLoadout:
      - AntagCentCommOp
      briefing:
        text: centcomm-role-greeting
        color: "#1d8bad"
        sound: "/Audio/Misc/cryo_warning.ogg"
      components:
      - type: AutoImplant
        implants:
          - DeathRattleImplantCentcomm
          - MindShieldImplant
      - type: BibleUser
      mindRoles:
        - MindRoleGhostCentCommOp
      tags:
        - CantBecomeRevolutionary