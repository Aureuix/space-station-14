- type: trait
  id: CHaet
  name: trait-language-chaet-name
  description: trait-language-chaet-desc
  category: LanguageTraits
  cost: 1
  effects:
    - !type:LanguageEffect
      languagesSpoken:
        - CHaet
      languagesUnderstood:
        - CHaet
  requirements:
    - !type:SpeciesRequirement
      species:
        - Kitsune
      inverted: true

- type: trait
  id: NovaCygni
  name: trait-language-novacygni-name
  description: trait-language-novacygni-desc
  category: LanguageTraits
  cost: 1
  effects:
    - !type:LanguageEffect
      languagesSpoken:
        - NovaCygni
      languagesUnderstood:
        - NovaCygni

- type: trait
  id: Diaspora
  name: trait-language-diaspora-name
  description: trait-language-diaspora-desc
  category: LanguageTraits
  cost: -2
  effects:
    - !type:OverrideCompsEffect
      components:
        - type: LanguageKnowledge
          speaks:
            - GalacticCommon
          understands:
            - GalacticCommon
        - type: LanguageSpeaker
          spokenLanguages:
            - GalacticCommon
          understoodLanguages:
            - GalacticCommon
  conflicts:
    - Foreigner
    - ForeignerLight
      
