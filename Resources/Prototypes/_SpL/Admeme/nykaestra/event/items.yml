    - type: Item
      size: Small
    - type: TriggerOnUse
    - type: SpawnEntityTableOnTrigger
      table: !type:AllSelector
        children:
          - id: MobNPCSVSFPatroller
          - id: MobNPCSVSFPatroller
          - id: MobNPCSVSFPatroller
      useMapCoords: true
    - type: DeleteOnTrigger

- type: entity
  parent: BaseItem
  name: hypospray
  id: HyposprayNPC
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: Objects/Specific/Medical/hypospray.rsi
      layers:
        - state: hypo
          map: [ "enum.SolutionContainerLayers.Base" ]
        - state: hypo_fill1
          map: [ "enum.SolutionContainerLayers.Fill" ]
          visible: false
    - type: Item
      sprite: Objects/Specific/Medical/hypospray.rsi
    - type: Injector
      solutionName: hypospray
      currentTransferAmount: 2
      ignoreClosed: false
      activeModeProtoId: HyposprayDynamicMode
      allowedModes:
        - HyposprayDynamicMode
    - type: Unremoveable
    #- type: Injector
    #  solutionName: hypospray
    #  currentTransferAmount: 5
    #  activeModeProtoId: TacticalJetInjectorDynamicMode
    #  allowedModes:
    #    - TacticalJetInjectorInjectMode
    - type: SolutionContainerManager
      solutions:
        hypospray:
          maxVol: 10000
          reagents:
            - ReagentId: Omnizine
              Quantity: 5000
            - ReagentId: Saline
              Quantity: 1500
            - ReagentId: PolypyryliumOligomers
              Quantity: 3500
    - type: UseDelay
      delay: 1
    - type: Appearance
      
