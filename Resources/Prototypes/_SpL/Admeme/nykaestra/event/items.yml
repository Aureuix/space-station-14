- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: SyndicateReinforcementRadioUnlimited
  name: Syndicate reinforcement radio
  suffix: ADMEME, unlimited
  description: Having a skill issue? Turn it into a skill solution by redspacing in some goons!
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: Item
      size: Small
    - type: UseDelay
      delay: 5
    - type: TriggerOnUse
    - type: TimerTrigger
      beepSound:
        path: "/Audio/Effects/Grenades/SelfDestruct/SDS_Charge.ogg"
        params:
          volume: -3
      initialBeepDelay: 0
      beepInterval: 5
      delay: 4
      keyOut: spawn
    - type: SpawnEntityTableOnTrigger
      table: !type:GroupSelector
        children:
          - id: MobSyndieShooterEstoc
          - id: MobSyndieShooterM90
          - id: MobSyndieShooterM90
          - id: MobSyndieShooterC20r
          - id: MobSyndieShooterC20r
          - id: MobSyndieShooterC20r
          - id: MobSyndieShooterBulldog
          - id: MobSyndieShooterPitbull
          - id: MobSyndieShooterPitbull
      keysIn:
        - spawn
      useMapCoords: true
      
- type: entity
  parent: SyndicateReinforcementRadioUnlimited
  id: SyndicateReinforcementRadioSquad
  name: Syndicate squad reinforcement radio
  suffix: ADMEME, squad
  description: Having a skill issue? Turn it into a skill solution by redspacing in some goons! Single use only, calls in a full squad.
  components:
    - type: SpawnEntityTableOnTrigger
      table: !type:AllSelector
        children:
          - id: MobSyndieShooterLeader
          - id: MobSyndieShooterEstoc
          - id: MobSyndieShooterM90
          - id: MobSyndieShooterC20r
          - id: MobSyndieShooterC20r
          - id: MobSyndieShooterBulldog
          - id: MobSyndieShooterPitbull
          - id: MobSyndieShooterPitbull
    - type: UseDelay
      delay: 4.2
    - type: DeleteOnTrigger
      keysIn:
        - spawn

