- type: entity
  parent: [ BaseItem, BaseCentcommContraband ]
  id: CentCommSVSFSpawnRadio
  name: Central Command elite squad spawner
  suffix: ADMEME ONLY
  description: Spawns a CSOD team when used, designating the user as the leader.
  components:
    - type: Sprite
      sprite: Objects/Devices/communication.rsi
      layers:
