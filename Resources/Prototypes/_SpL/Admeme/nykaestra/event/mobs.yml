## Syndicate
- type: entity
  parent: BaseMobHuman
  id: BaseMobSyndieShooter
  abstract: true
  name: syndicate soldier
  components:
    - type: MindExaminable
      state: None
    - type: Flammable
      flammableCollisionShape: 
        !type:PhysShapeCircle
        radius: "0"
    - type: MobThresholds
      stateAlertDict:
        Alive: "HumanHealth"
        Dead: "HumanDead"
      thresholds:
        0: Alive
        100: Dead
    - type: StaminaResistance
      damageCoefficient: 0.1
    - type: Appearance
    - type: InputMover
    - type: MobMover
    - type: NpcFactionMember
      factions:
        - Syndicate
      addHostileFactions:
        - NanoTrasen
    - type: NPCImprintingOnSpawnBehaviour
      whitelist:
        components:
          - HumanoidAppearance
      spawnFriendsSearchRadius: 1
    - type: Input
      context: "human"
    - type: Actions
    - type: NoSlip
    - type: WizdenNightVision
    - type: ContentEye
      targetZoom: "1.25, 1.25"
      maxZoom: "1.25, 1.25"
    - type: AutoImplant
      implants:
        - DeathAcidifierImplant
        # - DeathRattleImplant - likely unforseen consequences if we're testing them and there's traitors
    - type: RandomMetadata
      nameSegments:
        - NamesSyndicatePrefix
        - NamesSyndicateElite
      nameFormat: name-format-ert
    - type: TriggerOnSpawn
      keyOut: spawn
    - type: SpawnOnTrigger
      proto: EffectFlashRedspacePortal
      keysIn:
        - spawn


- type: entity
  parent: BaseMobSyndieShooter
  id: MobSyndieShooterLeader
  suffix: ADMEME, L6
  components:
    - type: HTN
      rootTask:
        task: SquadLeaderCompound
      blackboard:
        maxRange: !type:Single
          48
        RotateSpeed: !type:Single
          45
        SoundTargetInLOS: !type:SoundPathSpecifier
          path: /Audio/_Starlight/Effects/Radio/marauder_commander.ogg

    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Gun
      minAngle: 4
      maxAngle: 25
      angleIncrease: 4
      angleDecay: 16
      shotsPerBurst: 8
      burstFireRate: 8
      burstCooldown: 0.75
      selectedMode: Burst
      availableModes:
        - Burst
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    - type: BallisticAmmoProvider
      proto: CartridgeLightRifleSP
      capacity: 1000
      cycleable: false

    - type: Loadout
      prototypes:
        - NPCSyndicateSquadGearLeader
    - type: RandomMetadata
      nameSegments:
        - NamesSyndicateCommanderPrefix
        - NamesSyndicateElite
      nameFormat: name-format-ert
    - type: AutoImplant
      implants:
        - DeathAcidifierImplant
        # - DeathRattleImplant
        - SyndicateMindShieldImplant


