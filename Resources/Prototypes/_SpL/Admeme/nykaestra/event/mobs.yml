## Central
- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobERTShooter
  abstract: true
  name: Emergency Responder
  components:
    - type: MindExaminable
      state: None
    - type: Flammable
      flammableCollisionShape:
        !type:PhysShapeCircle
        radius: "0"
    - type: MobThresholds
      stateAlertDict:
        Alive: "HumanHealth"
        Critical: "HumanCrit"
        Dead: "HumanDead"
      thresholds:
        0: Alive
        100: Critical
        200: Dead
    - type: StaminaResistance
      damageCoefficient: 0.1
    - type: Appearance
    - type: InputMover
    - type: MobMover
    - type: NoSlip
    - type: NpcFactionMember
      factions:
        - NanoTrasen
      addFriendlyFactions:
        - NanoTrasen
      addHostileFactions:
        - SyndicateSilicon
        - DungeonSyndicate
        - DungeonSoviet
        - Syndicate
        - Pirate
        - SimpleHostile
        - Zombie
        - Abyss
        - AllHostile
        - Dragon
        - Xeno
        - Gorilla
        - Abductor
        - UltraMachineDungeon
        - Xenoborg
        - Revolutionary
    - type: NPCImprintingOnSpawnBehaviour
      whitelist:
        components:
          - HumanoidAppearance
      spawnFriendsSearchRadius: 1
    - type: Input
      context: "human"
    - type: Actions
    - type: WizdenNightVision
    - type: ContentEye
      targetZoom: "1.25, 1.25"
      maxZoom: "1.25, 1.25"
    - type: AutoImplant
      implants:
        - MindShieldImplant
        - DeathRattleImplantCentcomm
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirst
        - NamesMilitaryLast
      nameFormat: name-format-ert
    - type: TriggerOnSpawn
      keyOut: spawn
    - type: SpawnOnTrigger
      proto: EffectFlashBluespacePortalQuiet
      keysIn:
        - spawn
