- type: htnCompound
  id: RecoveryCompound
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnbuckleOperator
            shutdownState: TaskFinished
    - preconditions:
        - !type:PulledPrecondition
          isPulled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnPullOperator
            shutdownState: TaskFinished
    - preconditions:
        - !type:InContainerPrecondition
          isInContainer: true
      tasks:
        - !type:HTNCompoundTask
          task: EscapeCompound

- type: htnCompound
  id: FollowCloseCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:CoordinatesNotInRangePrecondition
              targetKey: FollowTarget
              rangeKey: MeleeRange
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            targetKey: FollowTarget
            rangeKey: MeleeRange
            removeKeyOnFinish: false
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
            - !type:CoordinatesInRangePrecondition
              targetKey: FollowTarget
              rangeKey: MeleeRange
          operator: !type:WaitOperator
            key: IdleTime
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickAccessibleOperator
            rangeKey: MeleeRange
            targetCoordinates: FollowIdleTarget
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            targetKey: FollowIdleTarget
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
            - !type:CoordinatesInRangePrecondition
              targetKey: FollowTarget
              rangeKey: MeleeRange
          operator: !type:WaitOperator
            key: IdleTime
            
- type: htnCompound
  id: FollowMedCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:CoordinatesNotInRangePrecondition
              targetKey: FollowTarget
              rangeKey: FollowRange
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            targetKey: FollowTarget
            rangeKey: FollowCloseRange
            removeKeyOnFinish: false
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
            - !type:CoordinatesInRangePrecondition
              targetKey: FollowTarget
              rangeKey: FollowRange
          operator: !type:WaitOperator
            key: IdleTime
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickAccessibleOperator
            rangeKey: FollowCloseRange
            targetCoordinates: FollowIdleTarget
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            targetKey: FollowIdleTarget
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
            - !type:CoordinatesInRangePrecondition
              targetKey: FollowTarget
              rangeKey: FollowRange
          operator: !type:WaitOperator
            key: IdleTime
            
- type: htnCompound
  id: ShooterTargetIdentifyCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
            key: Target
        - !type:HTNPrimitiveTask
          operator: !type:SpeakOperator
            speech: !type:LocalizedSetSpeakOperatorSpeech
              lineSet: ShooterEngage
            hidden: true
            cooldownID: shooter-target-spotted-alt
            cooldown: 3

- type: htnCompound
  id: ShooterTargetNeutralizedCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: VisionRadius
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: VisionRadius
          operator: !type:SpeakOperator
            speech: !type:LocalizedSetSpeakOperatorSpeech
              lineSet: ShooterDown
            hidden: true
            cooldownID: shooter-target-spotted
            cooldown: 3
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target
              
- type: htnCompound
  id: StationaryShooterCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: ShooterTargetIdentifyCompound
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: VisionRadius
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: VisionRadius
          operator: !type:GunOperator
            targetKey: Target
            requireLOS: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target
              
- type: htnCompound
  id: MeleeAttackCritTargetCompound
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: NearbyGunTargetsNoMercy
        preconditions:
          - !type:KeyExistsPrecondition
            key: Target
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:JumpOperator
            shutdownState: PlanFinished
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            brakeMaxVelocity: null
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetKey: Target
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
          services:
            - !type:UtilityService
              id: MeleeService
              proto: NearbyGunTargetsNoMercy
              key: Target
              
- type: htnCompound
  id: PassiveMovementCompound
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: false
        - !type:PulledPrecondition
          isPulled: false
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickAccessibleOperator
            rangeKey: VisionRadius
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false