- type: entity
  id: PartKitsune
  parent: [BaseItem, BasePart]
  name: "Kitsune body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoKitsune
  name: "Kitsune torso"
  parent: [PartKitsune, BaseTorso]
  components:
  - type: Sprite
    sprite: _SpL/Mobs/Species/Kitsune/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

