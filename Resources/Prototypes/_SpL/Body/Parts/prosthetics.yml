- type: entity
  id: PartProsthetic
  parent: [BaseItem, BasePart]
  name: "prosthetic body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Iron
        Quantity: 30
  - type: Item
    size: Large
    shape:
      - 0,0,0,1
  - type: LimbProsthetic

- type: entity
  id: LeftArmProsthetic
  name: "left prosthetic arm"
  parent: [PartProsthetic, BaseLeftArm]
  components:
    - type: BaseLayerId
      layers:
        Default: ProstheticLArm
    - type: Sprite
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "l_arm"
    - type: Icon
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "l_arm"
    - type: WithAttachedBodyParts
      parts:
        left hand: LeftHandProsthetic
    - type: RoundstartImplantable
      cost: 1

- type: entity
  id: LeftHandProsthetic
  name: "left prosthetic claw"
  parent: [PartProsthetic, BaseLeftHand]
  components:
    - type: BaseLayerId
      layers:
        Default: ProstheticLClaw
    - type: Sprite
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "l_claw"
    - type: Icon
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "l_claw"
    - type: RoundstartImplantable
      cost: 1

- type: entity
  id: RightArmProsthetic
  name: "right prosthetic arm"
  parent: [PartProsthetic, BaseRightArm]
  components:
    - type: BaseLayerId
      layers:
        Default: ProstheticRArm
    - type: Sprite
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "r_arm"
    - type: Icon
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "r_arm"
    - type: WithAttachedBodyParts
      parts:
        right hand: RightHandProsthetic
    - type: RoundstartImplantable
      cost: 1
  
- type: entity
  id: RightHandProsthetic
  name: "right prosthetic claw"
  parent: [PartProsthetic, BaseRightHand]
  components:
    - type: BaseLayerId
      layers:
        Default: ProstheticRClaw
    - type: Sprite
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "r_claw"
    - type: Icon
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "r_claw"
    - type: RoundstartImplantable
      cost: 1
  
- type: entity
  id: LeftLegProstheticTall
  name: "left prosthetic leg"
  parent: [PartProsthetic, BaseLeftLeg]
  components:
    - type: BaseLayerId
      layers:
        Default: ProstheticLPegleg
        Avali: ProstheticLBladelegShort
        Felionoid: ProstheticLBladelegShort
        Kitsune: ProstheticLBladeleg
        Resomi: ProstheticLBladelegShort
        Vox: ProstheticLBladeleg
        Vulpkanin: ProstheticLBladeleg
    - type: Sprite
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "l_pegleg"
    - type: Icon
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "l_pegleg"
    - type: MovementBodyPart
      sprintSpeed : 4.275 # -10% 
      maxDensity: 75
    - type: RoundstartImplantable
      cost: 2
    - type: LimbProsthetic
      children: false
    - type: WithAttachedBodyParts
      parts:
        left foot: PartSacrificialLeftFoot
    - type: ProtectedFromStepTriggers
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepProsthetic
        params:
          volume: 0.1
          variation: 0.07

- type: entity
  id: RightLegProstheticTall
  name: "right prosthetic leg"
  parent: [PartProsthetic, BaseRightLeg]
  components:
    - type: BaseLayerId
      layers:
        Default: ProstheticRPegleg
        Avali: ProstheticRBladelegShort
        Felionoid: ProstheticRBladelegShort
        Kitsune: ProstheticRBladeleg
        Resomi: ProstheticRBladelegShort
        Vox: ProstheticRBladeleg
        Vulpkanin: ProstheticRBladeleg
    - type: Sprite
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "r_pegleg"
    - type: Icon
      sprite: _SpL/Mobs/Customization/prosthetics.rsi
      state: "r_pegleg"
    - type: MovementBodyPart
      sprintSpeed : 4.275 # -10%
      maxDensity: 75
    - type: RoundstartImplantable
      cost: 2
    - type: LimbProsthetic
      children: false
    - type: WithAttachedBodyParts
      parts:
        right foot: PartSacrificialRightFoot
    - type: ProtectedFromStepTriggers
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepProsthetic
