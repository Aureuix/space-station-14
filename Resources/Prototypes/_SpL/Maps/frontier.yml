- type: gameMap
  id: SpLFrontier
  mapName: 'Frontier Outpost'
  mapPath: /Maps/_SpL/Stations/Frontier.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 0
  maxPlayers: 27
  stations:
    SpLFrontier:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Outpost {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'X'
        - type: GridSpawn
          groups:
            trade: !type:GridSpawnGroup
              addComponents:
                - type: ProtectedGrid
                - type: TradeStation
              paths:
                - /Maps/Shuttles/trading_outpost.yml
            cargo_mining_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Mining_Cracker.yml
              nameGrid: false
            cargo_salvage_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_Starlight/Shuttles/Salvage/pioneer.yml
              nameGrid: false
            ruins: !type:GridSpawnGroup
              hide: true
              nameGrid: true
              minCount: 4
              maxCount: 6
              stationGrid: false
              paths:
                - /Maps/Ruins/abandoned_outpost.yml
                - /Maps/Ruins/atmos_interchange.yml
                - /Maps/Ruins/chunked_tcomms.yml
                - /Maps/Ruins/biodome_satellite.yml
                - /Maps/Ruins/derelict.yml
                - /Maps/Ruins/djstation.yml
                - /Maps/Ruins/empty_flagship.yml
                - /Maps/Ruins/hydro_outpost.yml
                - /Maps/Ruins/old_ai_sat.yml
                - /Maps/Ruins/ruined_prison_ship.yml
                - /Maps/Ruins/syndicate_dropship.yml
                - /Maps/Ruins/whiteship_ancient.yml
                - /Maps/Ruins/whiteship_bluespacejumper.yml
                - /Maps/Ruins/wrecklaimer.yml
                - /Maps/Ruins/displaced_telescience.yml
                - /Maps/_Starlight/Ruins/Salv_Sus.yml 
            wrecks: !type:DungeonSpawnGroup
              minimumDistance: 150
              maximumDistance: 300
              stationGrid: false
              minCount: 20
              maxCount: 23
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
                - type: IFF
                  flags: HideLabel
                  color: "#88b0d1"
              protos:
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebris
                - ClusterAsteroid
                - SpindlyAsteroid
                - BlobAsteroid
                - SwissCheeseAsteroid
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - SwissCheeseTrash
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - ClusterMeat
                - SpindlyMeat
                - BlobAsteroidSnow
                - ClusterSnow
                - SwissCheeseSnow
                - ChunkDebrisSmall
                - ChunkDebrisSmall
            vgroid: !type:DungeonSpawnGroup
              minimumDistance: 200
              maximumDistance: 300
              nameDataset: NamesBorer
              stationGrid: false
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
              protos:
                - VGRoid
        - type: StationJobs
          availableJobs:
            # command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            # cargo
            SalvageSpecialist: [ 2, 2 ]
            MiningSpecialist: [ 2, 2 ]
            CargoTechnician: [ 2, 2 ]
            # engineering
            StationEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 1, 1 ]
            # medical
            MedicalDoctor: [ 1, 1 ]
            Paramedic: [ 1, 1 ]
            Chemist: [ 1, 1 ]
            # science
            Roboticist: [ 1, 1 ]
            Scientist: [ 2, 2 ]
            # security
            # law
            # service
            Botanist: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Assistant: [ -1, -1 ]
            # silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 2 ]
            #Representives

