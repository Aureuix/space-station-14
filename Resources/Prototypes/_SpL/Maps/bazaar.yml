- type: gameMap
  id: SpLBazaar
  mapName: 'Bazaar Station'
  mapPath: /Maps/_SpL/Stations/Bazaar.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 0
  maxPlayers: 50
  stations:
    SpLBazaar:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Bazaar {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'CRV'
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/cargo_silica.yml
        - type: GridSpawn
          groups:
            trade: !type:GridSpawnGroup
              addComponents:
                - type: ProtectedGrid
                - type: TradeStation
              paths:
                - /Maps/_Starlight/trading_outpost.yml
            cargo_mining_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Mining_Hammerhead.yml
              nameGrid: false
            cargo_salvage_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Salvage_Pioneer.yml
              nameGrid: false
            ruins: !type:GridSpawnGroup
              hide: true
              nameGrid: true
              minCount: 2
              maxCount: 3 
              stationGrid: false
              paths:
                - /Maps/Ruins/abandoned_outpost.yml
                - /Maps/Ruins/atmos_interchange.yml
                - /Maps/Ruins/chunked_tcomms.yml
                - /Maps/Ruins/biodome_satellite.yml
                - /Maps/Ruins/derelict.yml
                - /Maps/Ruins/djstation.yml
                - /Maps/Ruins/empty_flagship.yml
                - /Maps/Ruins/hydro_outpost.yml
                - /Maps/Ruins/old_ai_sat.yml
                - /Maps/Ruins/ruined_prison_ship.yml
                - /Maps/Ruins/syndicate_dropship.yml
                - /Maps/Ruins/whiteship_ancient.yml
                - /Maps/Ruins/whiteship_bluespacejumper.yml
                - /Maps/Ruins/wrecklaimer.yml
                - /Maps/Ruins/displaced_telescience.yml
                - /Maps/_Starlight/Ruins/Salv_Sus.yml 
            wrecks: !type:DungeonSpawnGroup
              minimumDistance: 150
              maximumDistance: 300
              stationGrid: false
              minCount: 16 
              maxCount: 20 
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
                - type: IFF
                  flags: HideLabel
                  color: "#88b0d1"
              protos:
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebris
                - ClusterAsteroid
                - SpindlyAsteroid
                - BlobAsteroid
                - SwissCheeseAsteroid
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - SwissCheeseTrash
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - ClusterMeat
                - SpindlyMeat
                - BlobAsteroidSnow
                - ClusterSnow
                - SwissCheeseSnow
                - ChunkDebrisSmall
                - ChunkDebrisSmall
            vgroid: !type:DungeonSpawnGroup
              minimumDistance: 300
              maximumDistance: 350
              nameDataset: NamesBorer
              stationGrid: false
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
              protos:
                - VGRoid
        - type: StationJobs
          availableJobs:
            # command
            Captain: [ 1, 1 ]
            # cargo
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 4, 4 ]
            MiningSpecialist: [ 4, 4 ]
            CargoTechnician: [ 4, 4 ]
            MailTech: [ 2, 2 ]
            SalvageLead: [ 1, 1 ]
            # engineering
            ChiefEngineer: [ 1, 1 ]
            StationEngineer: [ 4, 4 ]
            AtmosphericTechnician: [ 3, 3 ]
            TechnicalAssistant: [ 2, 2 ]
            # medical
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 4, 4 ]
            MedicalIntern: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            Paramedic: [ 2, 2 ]
            Chemist: [ 2, 2 ]
            Surgeon: [ 1, 1 ]
            # science
            ResearchDirector: [ 1, 1 ]
            Roboticist: [ 2, 2 ]
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ]
            # security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            DutyOfficer: [ 3, 3 ]
            SecurityOfficer: [ 5, 5 ]
            SecurityCadet: [ 2, 2 ]
            Detective: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            #law
            Magistrate: [ 1, 1 ]
            IAA: [ 1, 1 ]
            # service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Chef: [ 2, 2 ]
            Clown: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Librarian: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 2, 2 ]
            Reporter: [ 1, 1 ]
            ServiceWorker: [ 3, 3 ]
            Assistant: [ -1, -1 ]
            # silicon
            StationAi: [ 1, 1 ]
            Borg: [ 4, 4 ]
            #Representives
            BlueShield: [ 1, 1 ]
            NanoTrasenRepresentative: [ 1, 1 ]
            NanotrasenCareerTrainer: [ 1, 2 ]