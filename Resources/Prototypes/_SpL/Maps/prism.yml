- type: gameMap
  id: SpLPrism
  mapName: 'Prism Station'
  mapPath: /Maps/_SpL/Stations/Prism.yml 
  minPlayers: 10 
  maxPlayers: 80
  stations:
    StarlightPrism:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Prism Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SR'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/emergency_prism.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/cargo_prism.yml
        - type: GridSpawn
          groups:
            trade: !type:GridSpawnGroup
              addComponents:
                - type: ProtectedGrid
                - type: TradeStation
              paths:
                - /Maps/_SpL/trading_outpost.yml
              nameGrid: false
            cargo_mining_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Mining_Hammerhead.yml
              nameGrid: false
            cargo_salvage_shuttle: !type:GridSpawnGroup
              paths:
                - /Maps/_SpL/Shuttles/Salvage/Salvage_Pioneer.yml
              nameGrid: false
            ruins: !type:GridSpawnGroup
              hide: true
              nameGrid: true
              minCount: 4
              maxCount: 6
              stationGrid: false
              paths:
                - /Maps/Ruins/abandoned_outpost.yml
                - /Maps/Ruins/atmos_interchange.yml
                - /Maps/Ruins/chunked_tcomms.yml
                - /Maps/Ruins/biodome_satellite.yml
                - /Maps/Ruins/derelict.yml
                - /Maps/Ruins/djstation.yml
                - /Maps/Ruins/empty_flagship.yml
                - /Maps/Ruins/hydro_outpost.yml
                - /Maps/Ruins/old_ai_sat.yml
                - /Maps/Ruins/ruined_prison_ship.yml
                - /Maps/Ruins/syndicate_dropship.yml
                - /Maps/Ruins/whiteship_ancient.yml
                - /Maps/Ruins/whiteship_bluespacejumper.yml
                - /Maps/Ruins/wrecklaimer.yml
                - /Maps/Ruins/displaced_telescience.yml
                - /Maps/_Starlight/Ruins/Salv_Sus.yml
            wrecks: !type:DungeonSpawnGroup
              minimumDistance: 150
              maximumDistance: 300
              stationGrid: false
              minCount: 16
              maxCount: 20
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
                - type: IFF
                  flags: HideLabel
                  color: "#88b0d1"
              protos:
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebrisSmall
                - ChunkDebris
                - ClusterAsteroid
                - SpindlyAsteroid
                - BlobAsteroid
                - SwissCheeseAsteroid
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - SwissCheeseTrash
                - ClusterTrash
                - SpindlyTrash
                - BlobAsteroidTrash
                - ClusterMeat
                - SpindlyMeat
                - BlobAsteroidSnow
                - ClusterSnow
                - SwissCheeseSnow
                - ChunkDebrisSmall
                - ChunkDebrisSmall
            vgroid: !type:DungeonSpawnGroup
              minimumDistance: 300
              maximumDistance: 350
              nameDataset: NamesBorer
              stationGrid: false
              addComponents:
                - type: Gravity
                  enabled: true
                  inherent: true
              protos:
                - VGRoid
        - type: StationJobs
          availableJobs: 
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service
            Bartender: [ 1, 2]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 2 ]
            Janitor: [ 1, 1] 
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            ServiceWorker: [ 5, 5 ]
            #engineering
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 2, 3 ] 
            #medical 
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 4, 4 ]
            MedicalIntern: [ 3, 4 ] 
            Paramedic: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            Surgeon: [ 1, 1 ]
            #science 
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 3 ] 
            Roboticist: [ 2, 2 ]
            #security 
            Warden: [ 1, 1 ]
            DutyOfficer: [ 1, 1 ]
            SecurityOfficer: [ 4, 5 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 4, 4 ] 
            Brigmedic: [ 1, 1 ]
            #supply (4 - 5)
            SalvageSpecialist: [ 4, 4 ]
            MiningSpecialist: [ 3, 3 ]
            CargoTechnician: [ 4, 4 ]
            MailTech: [ 2, 2 ]
            SalvageLead: [ 1, 1 ]
            #civilian
            Assistant: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #silicon (3)
            StationAi: [ 1, 1 ]
            Borg: [ 4, 4 ]
            #law
            Magistrate: [ 1, 1 ]
            IAA: [ 2, 2 ]
            #Representives
            BlueShield: [ 1, 1 ]
            NanoTrasenRepresentative: [ 1, 1 ]            
            NanotrasenCareerTrainer: [ 1, 1 ]
