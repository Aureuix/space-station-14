- type: species
  id: Kitsune
  name: species-name-kitsune
  roundStart: true
  prototype: MobKitsune
  sprites: MobKitsuneSprites
  markingLimits: MobKitsuneMarkingLimits
  dollPrototype: MobKitsuneDummy
  skinColoration: Hues
  customName: true 
  roundstartCyberwareCapacity: 5 
  minAge: 18
  youngAge: 300
  oldAge: 500
  maxAge: 900
  minHeight: 0.9

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobKitsuneSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobKitsuneHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobKitsuneTorso
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobKitsuneLArm
    RArm: MobKitsuneRArm
    LHand: MobKitsuneLHand
    RHand: MobKitsuneRHand
    LLeg: MobKitsuneLLeg
    RLeg: MobKitsuneRLeg
    LFoot: MobKitsuneLFoot
    RFoot: MobKitsuneRFoot
    Tail: MobHumanoidAnyMarking 

- type: markingPoints
  id: MobKitsuneMarkingLimits
  points:
    Special: 
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ KitsuneEarsFluffy ] 
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 4 
      required: false
    Legs:
      points: 8 
      required: false
    Arms:
      points: 12 
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ KitsuneTwoTails ] 
