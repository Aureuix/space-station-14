- type: entity
  parent: BaseSubdermalImplant
  id: MedicalVitalsImplant
  name: vitals implant
  description: This implant will inform the Medical radio channel should the user fall into critical condition or die.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      whitelist:
        components:
          - MobState # admeme implanting chairs need to be able to die first- do I have a gas leak?
    - type: TriggerOnMobstateChange
      mobState:
        - Critical
        - Dead
    - type: RattleOnTrigger
      targetUser: true
      radioChannel: Medical
      
- type: entity
  parent: MindShieldImplant
  id: SyndicateMindShieldImplant
  name: syndicate mindshield implant
  description: This implant protects key figures from mind control devices.
  categories: [ HideSpawnMenu ]
  components:
    - type: MindShieldImplant
      mindShieldStatusIcon: SyndicateMindShieldIcon
      
- type: entity
  parent: BaseSubdermalImplant
  id: PacifismImplant
  name: pacifism implant
  description: This implant prevents the user from causing harm to others.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantComponents:
        - type: Pacified

- type: entity
  parent: [BaseAllTranslateLanguages, BaseSubdermalImplant]
  id: DIDImplant
  name: elysium implant
  description: This implant gives you a new friend.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowSpeech: true
    makeSentient: true
    prob: 1
    name: ghost-role-information-elysium-name
    description: ghost-role-information-elysium-description
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: Examiner
  - type: AutoImplant
    implants:
    - VoiceMaskImplant
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Syndicate
  - type: ActiveRadio
    channels:
    - Common
    - Syndicate