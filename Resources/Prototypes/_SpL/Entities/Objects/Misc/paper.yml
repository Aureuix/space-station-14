- type: entity
  name: gsl paper
  parent: Paper
  id: PaperGSL
  description: A single unit of bureaucracy, branded with the logo of Gemini Stellar Logistics.
  components:
    - type: Sprite
      sprite: Objects/Misc/bureaucracy.rsi
      layers:
        - state: paper_gsl
        - state: paper_gsl_words
          map: ["enum.PaperVisualLayers.Writing"]
          visible: false
        - state: paper_stamp-generic
          map: ["enum.PaperVisualLayers.Stamp"]
          visible: false
    - type: PaperVisuals
      backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
      contentMargin: 0.0, 0.0, 0.0, 0.0
      headerImagePath: "/Textures/_SpL/Interface/Paper/paper_heading_gsl_logo.svg.96dpi.png"
      headerMargin: 0.0, 0.0, 0.0, 0.0
      
