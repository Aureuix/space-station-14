- type: entity
  parent: [ IDCardStandard, BaseIlluminateContraband ]
  id: IlluminateIDCard
  name: Illuminate ID card
  description: An identification card used by... not you, probably.
  components:
   - type: Sprite
     sprite: _Starlight/Objects/Misc/id_cards.rsi
     layers:
       - sprite: &id-rsi Objects/Misc/id_cards.rsi
         state: orange # placeholder
       - sprite: *id-rsi
         state: stripe_top
         color: "#ffffff"
       - sprite: *id-rsi
         state: stripe_bottom
         color: "#ffffff"
       - sprite: _SpL/Interface/Misc/job_icons.rsi
         offset: &icon-offset -0.09375, 0.0625 #3 pixels left, 2 pixels up
         state: illuminate
   - type: IdCard 
     jobIcon: JobIconIlluminate
   - type: NanoChatCard
     listNumber: false
   - type: Access
     tags:
       - Illuminate
     
- type: entity
  parent: [ IDCardStandard, BaseGSLOwnedContraband ]
  id: GSLTechnicianIDCard
  name: GSL Technician ID card
  description: An identification card used by technicians operating under Gemini Stellar Logistics.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/id_cards.rsi
      layers:
        - state: tsf # placeholder
        - sprite: *id-rsi
          state: stripe_top
          color: "#00ffff"
        - sprite: *id-rsi
          state: stripe_bottom
          color: "#0000ff"
        - sprite: _SpL/Interface/Misc/job_icons.rsi
          offset: *icon-offset
          state: gsltech
    - type: IdCard
      jobIcon: JobIconGSLTech
    - type: NanoChatCard
      listNumber: false
    - type: Access
      tags:
        - GSL
    - type: PresetIdCard
      job: GSLTechnician
      
- type: entity
  parent: CBURNIDcard
  id: CBURNAltIDcard
  name: CBURN Liquidator ID card
  suffix: CBURN
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/id_cards.rsi
      layers:
        - state: centcomsilver
        - sprite: *id-rsi
          state: stripe_top
          color: "#0c7d1d" 
        - sprite: *id-rsi
          state: stripe_bottom
          color: "#0a5715"
        - sprite: _SpL/Interface/Misc/job_icons.rsi
          offset: *icon-offset
          state: liquidator
    - type: Item
      sprite: Objects/Misc/id_cards.rsi
      heldPrefix: silver
    - type: PresetIdCard
      job: CBURNAlt
    - type: NanoChatCard # CD
      listNumber: false