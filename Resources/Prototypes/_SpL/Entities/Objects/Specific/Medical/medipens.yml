- type: entity
  parent: [ ChemicalMedipen, BaseMedicalSecurityContraband ] 
  id: AdvancedBruteAutoinjector 
  suffix: Do Not Map
  name: advanced brute auto-injector
  description: A single-dose, non-refillable medipen containing tranexamic acid, bicaridine, and poly- polypry-... plant medicine, for long term stabilization.
  components:
    - type: Item
      inhandVisuals:
        left:
          - state: base-needle-inhand-left
          - state: base-colorA-inhand-left
            color: "#8820EB"
          - state: base-colorB-inhand-left
        right:
          - state: base-needle-inhand-right
          - state: base-colorA-inhand-right
            color: "#8820EB"
          - state: base-colorB-inhand-right
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Specific/Medical/medipen.rsi
      layers:
        - state: polypen
          map: ["enum.SolutionContainerLayers.Fill"]
    - type: SolutionContainerVisuals
      maxFillLevels: 1
      changeColor: false
      emptySpriteName: polypen_empty
    - type: SolutionContainerManager
      solutions:
        pen:
          maxVol: 30
          reagents:
            - ReagentId: PolypyryliumOligomers
              Quantity: 13
            - ReagentId: TranexamicAcid
              Quantity: 4
            - ReagentId: Bicaridine
              Quantity: 13
    - type: StaticPrice
      price: 1000
      
