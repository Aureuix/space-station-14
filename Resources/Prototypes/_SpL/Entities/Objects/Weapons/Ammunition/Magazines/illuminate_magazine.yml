- type: entity
  parent: [BasePowerCell, BaseIlluminateContraband]
  id: IlluminateCartridgeCoilgun
  name: coilgun cartridge
  description: A high-tech cartridge for coilgun flechettes, used by Illuminate-model longarms. Comes with an integrated battery.
  components:
    - type: Item
      storedRotation: -90
    - type: Battery
      maxCharge: 2500
      startingCharge: 2500
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Ammunition/coilguncartridge.rsi
      layers:
        - map: [ "enum.PowerCellVisualLayers.Base" ]
          state: base
        - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
          state: o2
          shader: unshaded
    - type: Tag
      tags:
        - CartridgeCoilgun
        - IlluminateTech

- type: entity
  id: CartridgeCoilgunEmpty
  parent: [IlluminateCartridgeCoilgun, BaseIlluminateContraband]
  suffix: Empty
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Ammunition/coilguncartridge.rsi
      layers:
        - map: [ "enum.PowerCellVisualLayers.Base" ]
          state: base
        - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
          state: o2
          shader: unshaded
          visible: false
    - type: Battery
      startingCharge: 0
      
- type: entity
  id: Magazine Flechette
  parent: [BaseCartridge, BaseIlluminateContraband]
  name: Magazine Flechette
  components:
    - type: Tag
      tags:
        - IlluminateTech
    - type: BallisticAmmoProvider
      whitelist:
        tags:
          - CartridgeFlechette
      proto: CartridgeFlechette
      capacity: 24
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Ammunition/Magazines/flechette.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag
      steps: 8
      zeroVisible: false
    - type: Appearance