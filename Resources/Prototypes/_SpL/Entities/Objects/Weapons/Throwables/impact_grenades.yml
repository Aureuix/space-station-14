- type: entity 
  parent: BaseItem
  abstract: true
  id: BaseImpactGrenade
  components:
    - type: Sprite
      sprite: Objects/Weapons/Grenades/grenade.rsi
      layers:
        - state: icon
          map: ["enum.TriggerVisualLayers.Base"]
    - type: Item
      size: Small
    - type: Clothing
      quickEquip: false
      slots:
        - Belt
    - type: Damageable
      damageContainer: Inorganic
    - type: DamageOnLand
      damage:
        types:
          Blunt: 10
    - type: Destructible
      thresholds:
        - trigger: # Start fuse
            !type:DamageTrigger
            damage: 10
          behaviors:
          - !type:ExplodeBehavior
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
    - type: Appearance
    - type: AnimationPlayer
    - type: GenericVisualizer
      visuals:
        enum.Trigger.TriggerVisuals.VisualState:
          enum.ConstructionVisuals.Layer:
            Primed: { state: primed }
            Unprimed: { state: icon }
    - type: Tag
      tags:
        - HandGrenade
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.2
          density: 20 # derived from base_item
          mask:
            - ItemMask
          restitution: 0.3
          friction: 0.2
    - type: Explosive
      explosionType: Default
      totalIntensity: 100
      intensitySlope: 3
      maxIntensity: 10
      canCreateVacuum: false

- type: entity
  parent: [ BaseImpactGrenade, BaseHighlyIllegalContraband ]
  id: GrenadeImpact
  name: impact grenade
  description: Causes a powerful explosion upon striking a hard surface. Arm before throwing
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/large_grenade.rsi
    state: large_grenade_armed
  - type: ItemSwitch
    state: unarmed
    states:
      unarmed: !type:ItemSwitchState
        verb: unarmed
        sprite:
          sprite: Objects/Specific/Chemistry/large_grenade.rsi
          state: ass
        # soundStateActivate: /Audio/Machines/door_lock_off.ogg # yeah is makes a noise when it spawns for some reason unless this is off. frankly quite incredible
        components:
        - type: Destructible
          thresholds:
            - trigger:
                !type:DamageTrigger
                damage: 100
              behaviors:
                - !type:ExplodeBehavior
      armed: !type:ItemSwitchState
        verb: armed
        sprite:
          sprite: Objects/Specific/Chemistry/large_grenade.rsi
          state: armed
        soundStateActivate: /Audio/Effects/beep_landmine.ogg
        components:
          - type: Destructible
            thresholds:
              - trigger:
                  !type:DamageTrigger
                  damage: 10
                behaviors:
                  - !type:ExplodeBehavior
              - trigger:
                  !type:DamageTrigger
                  damage: 100
                behaviors:
                  - !type:ExplodeBehavior
    
- type: entity
  parent: [ BaseImpactGrenade, BaseHighlyIllegalContraband ]
  id: GrenadeImpactNoArm
  suffix: Auto-armed
  name: impact grenade
  description: Causes a powerful explosion upon striking a hard surface.
  components:
    - type: Sprite
      sprite: Objects/Specific/Chemistry/large_grenade.rsi
      state: large_grenade_armed

# Reader beware, molotov shityaml below
- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: GrenadeMolotovEmpty
  name: molotov cocktail
  suffix: empty
  description: A molotov cocktail under construction. This one is missing a rag.
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Throwables/molotov.rsi
      layers:
        - state: base
    - type: Item
      sprite: Objects/Consumable/Drinks/beer.rsi
      size: Small
    - type: Construction
      graph: MolotovGraph 
      node: empty
      defaultTarget: molotov
    - type: DamageOnLand
      damage:
        types:
          Blunt: 10
    - type: SolutionContainerManager
      solutions:
        drink:
          maxVol: 30
          reagents:
            - ReagentId: WeldingFuel
              Quantity: 30
    - type: ExaminableSolution
      solution: drink
    - type: Spillable
      solution: drink
    - type: Damageable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 10
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                path: /Audio/Effects/glass_break2.ogg
                params:
                  volume: 1
            - !type:SpillBehavior { }
            - !type:SpawnEntitiesBehavior
              spawn:
                ShardGlass:
                  min: 1
                  max: 1
              transferForensics: true
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

- type: entity
  name: molotov cocktail
  id: GrenadeMolotov
  description: Resist! Resist!
  parent: [ BaseItem, BaseMajorContraband ]
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Throwables/molotov.rsi
      state: icon
    - type: Item
      sprite: _SpL/Objects/Weapons/Throwables/molotov.rsi
      size: Small
    - type: Construction
      graph: MolotovGraph
      node: molotov
    - type: Damageable
      damageContainer: Inorganic
    - type: DamageOnLand
      damage:
        types:
          Blunt: 10
    - type: ExaminableSolution
      solution: drink
    - type: Spillable
      solution: drink
    - type: SolutionContainerManager
      solutions:
        drink:
          maxVol: 30
          reagents:
            - ReagentId: WeldingFuel
              Quantity: 30
    - type: ItemSwitch
      state: inactive
      states:
        inactive: !type:ItemSwitchState
          verb: inactive
          sprite:
            sprite: _SpL/Objects/Weapons/Throwables/molotov.rsi
            state: rag
          soundStateActivate: /Audio/Items/candle_blowing.ogg
          components:
          - type: Destructible
            thresholds:
              - trigger:
                  !type:DamageTrigger
                  damage: 10
                behaviors:
                  - !type:PlaySoundBehavior
                    sound:
                      path: /Audio/Effects/glass_break2.ogg
                      params:
                        volume: 1
                  - !type:SpillBehavior { }
                  - !type:SpawnEntitiesBehavior
                    spawn:
                      ShardGlass:
                        min: 1
                        max: 1
                    transferForensics: true
                  - !type:DoActsBehavior
                    acts: [ "Destruction" ]
              - trigger:
                  !type:DamageTrigger
                  damage: 100
                behaviors:
                  - !type:DoActsBehavior
                    acts: [ "Destruction" ]
        active: !type:ItemSwitchState
          verb: active
          sprite:
            sprite: _SpL/Objects/Weapons/Throwables/molotov.rsi
            state: icon
          soundStateActivate: /Audio/Items/Flare/flare_on.ogg
          components:
          - type: Destructible
            thresholds:
              - trigger: 
                  !type:DamageTrigger
                  damage: 10
                behaviors:
                - !type:PlaySoundBehavior
                  sound:
                    path: /Audio/Effects/fire.ogg
                    params:
                      volume: 4
                - !type:PlaySoundBehavior
                  sound:
                    path: /Audio/Effects/lightburn.ogg
                    params:
                      volume: 2
                - !type:PlaySoundBehavior
                  sound:
                    path: /Audio/Effects/glass_break2.ogg
                    params:
                      volume: 2
                - !type:SpillBehavior { }
                - !type:SpawnEntitiesBehavior
                  spawn:
                    ShardGlass:
                      min: 1
                      max: 1
                - !type:ExplodeBehavior
              - trigger:
                  !type:DamageTrigger
                  damage: 100
                behaviors:
                - !type:DoActsBehavior
                  acts: [ "Destruction" ]
          - type: Explosive
            explosionType: Molotov
            totalIntensity: 30
            intensitySlope: 3
            maxIntensity: 3
            tileBreakScale: 0
            canCreateVacuum: false