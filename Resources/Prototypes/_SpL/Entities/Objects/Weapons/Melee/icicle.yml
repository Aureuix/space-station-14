- type: entity
  name: VL15 "icicle"
  description: A lightweight aerogel-bladed glaive commonly carried by Illuminate hatchery guards. Its self-restoring blade is designed to shard and lodge in enemy flesh, causing severe bleeding.
  id: WeaponIlluminateIcicle
  parent: [ BaseItem, BaseIlluminateContraband ]
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Melee/Icicle.rsi
      state: icon
    - type: Item
      size: Ginormous
      sprite: _SpL/Objects/Weapons/Melee/Icicle.rsi
    - type: Clothing
      sprite: _SpL/Objects/Weapons/Melee/Icicle.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: Appearance
    - type: ItemSwitch
      state: inactive
      # SpL- defines functionality between active and inactive
      states:
        active: !type:ItemSwitchState
          verb: active
          soundStateActivate:
            path: /Audio/Items/unsheath.ogg
          sprite:
            sprite: _SpL/Objects/Weapons/Melee/Icicle.rsi
            state: active
          components:
            - type: MeleeWeapon
              wideAnimationRotation: -135
              attackRate: 1.3
              soundHit:
                collection: GlassBreak
              damage:
                types:
                  Slash: 5
                  Piercing: 5
            - type: Wieldable
            - type: IncreaseDamageOnWield
              damage:
                types:
                  Slash: 5
                  Piercing: 15
                bloodlossModifier: 2
            - type: PointLight
              enabled: false
              radius: 1.5
              energy: 1.5
              color: "#ff7a00"
              castShadows: false
              netsync: false
            - type: Tool
              qualities:
                - Slicing
            - type: Reflect
              reflectProb: 0.25
              spread: 75

        inactive: !type:ItemSwitchState
          verb: inactive
          soundStateActivate:
            path: /Audio/Items/sheath.ogg
          sprite:
            sprite: _SpL/Objects/Weapons/Melee/Icicle.rsi
            state: inactive
          components:
            - type: MeleeWeapon
              wideAnimationRotation: -135
              attackRate: 1.3
              soundHit:
                collection: GenHit
              damage:
                types:
                  Blunt: 5
            - type: Wieldable
            - type: IncreaseDamageOnWield
              damage:
                types:
                  Blunt: 7