- type: entity
  parent: [ BaseKnife, BaseWeaponCrusher, BaseCentcommContraband]
  id: CentcommVibrocutter
  name: SCSPT-103 vibrocutter
  description: The vibrocutter originates from an initial attempt to downsize the SCS-101 prototype vibroblade to suit the needs of concealed self defense for Vulcan Industries' high-profile personnel. Compaction came at a both a major reduction in cost and in effectiveness, although the model remains popular as a fighting and rescue knife among Central Command personnel.
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Melee/Vibrocutter.rsi
      state: icon
    - type: Item
      sprite: _SpL/Objects/Weapons/Melee/Vibrocutter.rsi
    - type: MeleeWeapon
      autoAttack: true
      wideAnimationRotation: -135
      attackRate: 2
      damage:
        types:
          Slash: 6
          Piercing: 6
          Structural: 12
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/star_hit.ogg
      offset: -0.15,0.0
    - type: LandAtCursor
    - type: DamageOtherOnHit
      damage:
        types:
          Slash: 5
          Piercing: 5
          Structural: 10
    - type: DisarmMalus
    - type: ThrowingAngle
      angle: 225
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PolygonShape
            radius: 0.01
            vertices:
              - -0.4,-0.2
              - -0.2,-0.4
              - 0.4,0.2
              - 0.2,0.4
          density: 20 
          mask:
            - ItemMask
          restitution: 0.3
          friction: 0.2