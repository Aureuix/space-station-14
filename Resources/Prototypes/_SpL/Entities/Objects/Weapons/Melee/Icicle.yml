  id: WeaponIlluminateIcicleEmpty
  parent: [ BaseItem, BaseIlluminateContraband ]
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Melee/Illuminate/Icicle-Empty.rsi
      state: icon
    - type: Item
      size: Ginormous
      sprite: _SpL/Objects/Weapons/Melee/Illuminate/Icicle-Empty-Inhands.rsi
    - type: Clothing
      sprite: _SpL/Objects/Weapons/Melee/Illuminate/Icicle-Empty.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: Tag
      tags:
        - IlluminateTech
    - type: Appearance
    - type: MeleeWeapon
      wideAnimationRotation: -135
      attackRate: 1.3
      damage:
        types:
          Blunt: 5
    - type: Wieldable
    - type: IncreaseDamageOnWield
      damage:
        types:
          Blunt: 7
          
