- type: entity
  name: VL15 "icicle"
  description: A lightweight aerogel-bladed glaive commonly carried by Illuminate hatchery guards. Its blade is designed to shard and lodge in enemy flesh, causing severe bleeding. It is equipped with an internal fabricator, but use will gradually drain its matter silo.
  id: WeaponIlluminateIcicle
  parent: [ BaseItem, BaseIlluminateContraband ]
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Melee/Illuminate/Icicle.rsi
      state: icon
    - type: Item
      size: Ginormous
      sprite: _SpL/Objects/Weapons/Melee/Illuminate/Icicle-Inhands.rsi
    - type: Clothing
      sprite: _SpL/Objects/Weapons/Melee/Illuminate/Icicle.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: Tag
      tags:
        - IlluminateTech
    - type: Appearance
    - type: MeleeWeapon
      wideAnimationRotation: -135
      attackRate: 1.3
      damage:
        types:
          Slash: 5
          Piercing: 5
      soundHit:
        collection: GlassBreak
    - type: Wieldable
    - type: IncreaseDamageOnWield
      damage:
        types:
          Slash: 10
          Piercing: 15
    - type: DisarmMalus
    - type: Tool
      qualities:
        - Slicing
    - type: Reflect
      reflectProb: 0.25
      spread: 75
    # \/\/ This defines the total amount of hits the weapon can make before needing to charge
    - type: Damageable 
      damageContainer: Inorganic
    - type: ExaminableDamage
      messages: WindowMessages
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1500
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                path: /Audio/Machines/Nuke/angry_beep.ogg
                params:
                  volume: -3
                  rolloffFactor: 1.3
            - !type:SpawnEntitiesBehavior
              spawn:
                WeaponIlluminateIcicleEmpty:
                  min: 1
                  max: 1
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: DamageOnHit 
      damage:
        types:
          Blunt: 25 # This provides 60 melee hits total
          
