- type: entity
  name: holoflare pistol
  parent: [BaseWeaponBatterySmall, BaseSecuritySalvageMiningContraband]
  id: WeaponHoloflarePistol
  description: A self-recharging ranged light projector that creates "cold" holographic flares upon surfaces.
  components:
    - type: Sprite
      sprite: _NF/Objects/Weapons/Guns/Battery/holoflarepistol.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mode-cyan
          map: [ "enum.FireModesLayers.FireMode" ]
          shader: unshaded
        - state: mag-unshaded-2
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Clothing
      sprite: _NF/Objects/Weapons/Guns/Battery/holoflarepistol.rsi
    - type: Gun
      fireRate: 1 
      soundGunshot:
        path: /Audio/Items/Flare/flare_on.ogg
    - type: Battery
      maxCharge: 270
      startingCharge: 270
    - type: BatteryAmmoProvider
      proto: ProjectileFlareCyan
      fireCost: 90
    - type: BatteryWeaponFireModes
      fireModes:
        - proto: ProjectileFlareCyan
          fireCost: 90
          magState: mag
          visualState: mode-cyan
        - proto: ProjectileFlareRed
          fireCost: 90
          magState: mag
          visualState: mode-red
        - proto: ProjectileFlareYellow
          fireCost: 90
          magState: mag
          visualState: mode-yellow
    - type: PacifismAllowedGun
    - type: AmmoCounter
    - type: BatterySelfRecharger
      autoRechargeRate: 3
    - type: MagazineVisuals
      magState: mag
      steps: 3
      zeroVisible: true
    - type: Appearance
    - type: Tag
      tags:
        - Sidearm
        - LaserWeapon
    - type: StaticPrice
      price: 200
    - type: ContainerContainer
      containers:
        firing_pin: !type:Container
    - type: ContainerFill
      containers:
        firing_pin:
          - FiringPinAdvancedLaser
    - type: FiringPinHolder
      supportedPins: [ Laser ]

- type: entity
  name: mining laser
  parent: [ BaseWeaponBattery, BaseGunWieldable, BaseSalvageMiningContraband ]
  id: WeaponMiningLaser
  description: A heavy duty laser weapon designed to drill through solid objects with minimal friendly fire risk. 
  components:
    - type: Item
      size: Huge
      shape:
        - 0,0,3,1
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Guns/Battery/mininglaser.rsi
      state: base
    - type: Battery 
      maxCharge: 4000
      startingCharge: 4000
    - type: Appearance
    - type: Clothing
      sprite: _SpL/Objects/Weapons/Guns/Battery/mininglaser.rsi
    - type: Gun
      fireRate: 6
      selectedMode: FullAuto 
      availableModes:
        - FullAuto 
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/ship_svalinn.ogg
        params:
          volume: -4
    - type: BatteryAmmoProvider
      proto: DestructionBeamWeak
      fireCost: 40

- type: entity
  parent: [BaseWeaponBattery, BaseIlluminateContraband, BaseGunWieldable]
  id: WeaponIlluminateBlizzard
  name: AR12 "blizzard"
  description: The standard longarm of the Illuminate, the AR12 uses electromagnetic coils to propel flechettes at supersonic speeds with minimal recoil.
  components:
    - type: CanDualWield
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Battery/blizzard.rsi
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded  
    - type: Item
      size: Large
      shape:
        - 0,0,2,1
    - type: Clothing
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Battery/blizzard.rsi
    - type: AmmoCounter
    - type: Gun
      selectedMode: FullAuto
      availableModes:
        - SemiAuto
        - FullAuto
        - Burst
      shotsPerBurst: 3
      fireRate: 4.5
      soundGunshot:
        path: /Audio/_SpL/Effects/coilgun.ogg
        params:
          volume: -2
      soundEmpty:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
    - type: Battery
      maxCharge: 0
      startingCharge: 0
    - type: BatteryAmmoProvider
      proto: BulletGauss
      fireCost: 50
    - type: ItemSlots
      slots:
        cell_slot:
          name: Magazine
          startingItem: IlluminateCartridgeCoilgun
          insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
          whitelist:
            tags:
              - CartridgeCoilgun
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: StaticPrice
      price: 500
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
        firing_pin: !type:Container
    - type: ContainerFill
      containers:
        firing_pin:
          - FiringPinAdvancedLaser
    - type: FiringPinHolder
      supportedPins: [ AdvancedLaser ]
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: true
    - type: Appearance
    - type: GunWieldBonus
      minAngle: -20
      maxAngle: -30
    - type: Tag
      tags:
        - IlluminateTech