- type: entity
  parent: [BaseWeaponBattery, BaseIlluminateContraband, BaseGunWieldable]
  id: WeaponIlluminateBlizzard
  name: AR12 "blizzard"
  description: The standard longarm of the Illuminate, the AR12 uses electromagnetic coils to propel flechettes at supersonic speeds with minimal recoil.
  components:
    - type: CanDualWield
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Battery/blizzard.rsi
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded  
    - type: Item
      size: Large
      shape:
        - 0,0,2,1
    - type: Clothing
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Battery/blizzard.rsi
    - type: AmmoCounter
    - type: Gun
      selectedMode: FullAuto
      availableModes:
        - SemiAuto
        - FullAuto
        - Burst
      shotsPerBurst: 3
      fireRate: 5
      soundGunshot:
        path: /Audio/_SpL/Effects/coilgun.ogg
        params:
          volume: -2
      soundEmpty:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
    - type: Battery
      maxCharge: 0
      startingCharge: 0
    - type: BatteryAmmoProvider
      proto: BulletGauss
      fireCost: 50
    - type: ItemSlots
      slots:
        cell_slot:
          name: Magazine
          startingItem: IlluminateCartridgeCoilgun
          insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
          whitelist:
            tags:
              - CartridgeCoilgun
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: StaticPrice
      price: 500
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
        firing_pin: !type:Container
    - type: ContainerFill
      containers:
        firing_pin:
          - FiringPinAdvancedLaser
    - type: FiringPinHolder
      supportedPins: [ AdvancedLaser ]
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: true
    - type: Appearance
    - type: GunWieldBonus
      minAngle: -20
      maxAngle: -30
    - type: Tag
      tags:
        - IlluminateTech