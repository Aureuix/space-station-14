- type: entity
  name: AR12 "blizzard"
  parent: [BaseWeaponBattery, BaseIlluminateContraband, BaseGunWieldable]
  id: WeaponIlluminateBlizzard
  description: The standard longarm of the Illuminate, the AR12 uses energy to generate and fire aerogel bolts at supersonic speeds via a powerful compact railgun configuration.
  components:
    - type: CanDualWield
    - type: Appearance
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Guns/Battery/blizzard.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Clothing
      sprite: _SpL/Objects/Weapons/Guns/Battery/blizzard.rsi
    - type: MagazineVisuals
      magState: laser
      steps: 5
      zeroVisible: true
    - type: Gun
      fireRate: 4
      selectedMode: FullAuto
      availableModes:
        - FullAuto
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/ship_svalinn.ogg
        params:
          volume: -2
    - type: BatteryAmmoProvider
      proto: BulletRailgun
      fireCost: 50
    - type: Item
      size: Large
      shape:
        - 0,0,2,1
  
    - type: Battery
      maxCharge: 1000
      startingCharge: 1000
    - type: BatterySelfRecharger
      autoRechargeRate: 100
      autoRechargePauseTime: 5
    - type: ContainerContainer
      containers:
        firing_pin: !type:Container
    - type: ContainerFill
      containers:
        firing_pin:
          - FiringPinAdvancedLaser
    - type: FiringPinHolder
      supportedPins: [ AdvancedLaser ]