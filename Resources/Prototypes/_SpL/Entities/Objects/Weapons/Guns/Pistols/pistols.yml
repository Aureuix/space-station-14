- type: entity
  name: yangtze
  parent: [ BaseWeaponPistol, BaseSecuritySalvageContraband ]
  id: WeaponPistolMauser
  description: Officially designated the C97 Service Pistol, the Yangtze is a modernised adaptation of a cheap but reliable old-world semi-automatic handgun sporting a proprietary rubberised grip. Feeds from .40 pistol magazines.
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Guns/Pistols/mauser.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Clothing
      sprite: _SpL/Objects/Weapons/Guns/Pistols/mauser.rsi
    - type: Item
      storedOffset: 0,-2
    - type: Gun
      fireRate: 3 # it's not as good as the dp
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/_Starlight/Weapons/Guns/Gunshots/stechkin.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazinePistol40SP
          insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazinePistolDP
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          startingItem: CartridgePistol40SP
          priority: 1
          whitelist:
            tags:
              - CartridgePistolDP
    - type: StealTarget
      stealGroup: OfficerHandgun

- type: entity
  name: anaconda
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: WeaponPistolAnaconda
  description: A complex Waffle Corp handgun designed for use by corporate officials and operatives on extended deployments. Creates caseless FMJ ammunition on the fly from an internal fabricator, which slowly self-charges.
  components:
    - type: Gun
      fireRate: 3
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/hpistol.ogg
    - type: Sprite
      sprite: _Goobstation/Objects/Weapons/Guns/Pistols/anaconda.rsi
      state: icon
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: BallisticAmmoProvider
      whitelist:
        tags:
          - CartridgePistolDP
      capacity: 8
      proto: CartridgeCaselessRifleFMJ
      unspawnedCount: 7
      cycleable: false 
    - type: BallisticAmmoSelfRefiller
      autoRefillRate: 2s
      affectedByEmp: true
      firingPausesAutoRefill: true
      autoRefillPauseDuration: 0.75s
    - type: AmmoCounter
    - type: Item
      size: Small
      shape:
        - 0,0,1,0
        - 0,1,0,1
      storedOffset: 0,-4
    - type: Clothing
      sprite: Objects/Weapons/Guns/Pistols/viper.rsi
      quickEquip: false
      slots:
        - suitStorage
        - Belt
    - type: Tag
      tags:
        - Sidearm
    - type: CanDualWield
      dualWieldInaccuracyPenalty: 30
    - type: StaticPrice
      price: 2000
    - type: MeleeWeapon
      wideAnimationRotation: 0
      damage:
        types:
          Blunt: 6
      angle: 0
      animation: WeaponArcThrust
      soundHit:
        collection: MetalThud
    - type: AltFireMelee
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_SpL/Effects/holster.ogg
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_SpL/Effects/pistol_drop.ogg

- type: entity
  id: WeaponIlluminateFrostbite
  parent: [ BaseWeaponPistol, BaseIlluminateContraband ]
  name: PD52 "frostbite"
  description: A one-handed cross between handgun and SMG, the PD52 comes with an inbuilt silencer and fires jet-propelled flechette rounds.
  components:
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Pistols/frostbite.rsi
      layers:
        - state: base
          map: [ "enum.GunVisualLayers.Base" ]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: AmmoCounter
    - type: Tag
      tags:
        - IlluminateTech
    - type: Item
      size: Small
      shape:
        - 0,0,1,1
    - type: Gun
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/hushpup.ogg
        params:
          volume: -2
          rolloffFactor: 1.3
      soundEmpty:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
      fireRate: 5
      selectedMode: FullAuto
      availableModes:
        - FullAuto
        - Burst
      shotsPerBurst: 3
    - type: ChamberMagazineAmmoProvider
      autoEject: true
      soundAutoEject:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
      soundRack:
        path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: IlluminateMagazineFlechette
          insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineFlechette
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgeFlechette

- type: entity
  name: appraisal tool
  parent: BaseWeaponPistol
  id: WeaponAppraisalToolPistol
  description: A beancounter's best friend, with a quantum connection to the galactic market and the ability to appraise even the toughest items. It will also tell you if a crate contains a completed bounty.
  suffix: Gun
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Guns/Pistols/appraisal-tool.rsi
      layers: 
        - sprite: Objects/Tools/appraisal-tool.rsi
          state: icon
    - type: Item
      sprite: Objects/Tools/appraisal-tool.rsi
      size: Small
      shape:
        - 0,0,0,1
    - type: PriceGun
    - type: UseDelay
      delay: 3
    - type: Clothing
      sprite: Objects/Tools/appraisal-tool.rsi
      quickEquip: false
      slots:
        - Belt
        - suitStorage
    - type: ChamberMagazineAmmoProvider
      boltClosed: null
    - type: Tag
      tags:
        - AppraisalTool
        - Sidearm