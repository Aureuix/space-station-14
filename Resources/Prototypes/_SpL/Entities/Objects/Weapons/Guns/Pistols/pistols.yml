- type: entity
  id: WeaponIlluminateFrostbite
  parent: [ BaseWeaponPistol, BaseIlluminateContraband]
  name: PD52 "frostbite"
  description: A one-handed cross between handgun and SMG, the PD52 comes with an inbuilt silencer and fires jet-propelled flechette rounds.
  components:
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Pistols/frostbite.rsi
      layers:
        - state: base
          map: [ "enum.GunVisualLayers.Base" ]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: AmmoCounter
    - type: Tag
      tags:
        - IlluminateTech
    - type: Item
      size: Small
      shape:
        - 0,0,1,1
    - type: Gun
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/hushpup.ogg
        params:
          volume: -2
          rolloffFactor: 1.3
      soundEmpty:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
      fireRate: 5
      selectedMode: FullAuto
      availableModes:
        - FullAuto
        - Burst
      shotsPerBurst: 3
    - type: ChamberMagazineAmmoProvider
      autoEject: true
      soundAutoEject:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
      soundRack:
        path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: IlluminateMagazineFlechette
          insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineFlechette
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgeFlechette

- type: entity
  name: appraisal tool
  parent: BaseWeaponPistol
  id: WeaponAppraisalToolPistol
  description: A beancounter's best friend, with a quantum connection to the galactic market and the ability to appraise even the toughest items. It will also tell you if a crate contains a completed bounty.
  suffix: Gun
  components:
    - type: Sprite
      sprite: _SpL/Objects/Weapons/Guns/Pistols/appraisal-tool.rsi
      layers: 
        - sprite: Objects/Tools/appraisal-tool.rsi
          state: icon
    - type: Item
      sprite: Objects/Tools/appraisal-tool.rsi
      size: Small
      shape:
        - 0,0,0,1
    - type: PriceGun
    - type: UseDelay
      delay: 3
    - type: Clothing
      sprite: Objects/Tools/appraisal-tool.rsi
      quickEquip: false
      slots:
        - Belt
        - suitStorage
    - type: ChamberMagazineAmmoProvider
      boltClosed: null
    - type: Tag
      tags:
        - AppraisalTool
        - Sidearm