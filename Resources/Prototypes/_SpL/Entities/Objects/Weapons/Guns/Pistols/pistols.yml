- type: entity
  id: WeaponIlluminateFrostbite
  parent: [ BaseWeaponPistol, BaseIlluminateContraband]
  name: PD52 "frostbite"
  description: A one-handed cross between handgun and SMG, the PD52 comes with an inbuilt silencer and fires jet-propelled flechette rounds.
  components:
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Pistols/frostbite.rsi
      layers:
        - state: base
          map: [ "enum.GunVisualLayers.Base" ]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: AmmoCounter
    - type: Tag
      tags:
        - IlluminateTech
    - type: Item
      size: Small
      shape:
        - 0,0,1,1
    - type: Gun
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/hushpup.ogg
        params:
          volume: -2
          rolloffFactor: 1.3
      soundEmpty:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
      soundBolt:
        path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
      soundUnbolt:
        path: /Audio/Weapons/Guns/Cock/shotgun_open.ogg
      fireRate: 5
      selectedMode: FullAuto
      availableModes:
        - FullAuto
        - Burst
      shotsPerBurst: 3
    - type: ChamberMagazineAmmoProvider
      autoEject: true
      soundAutoEject:
        path: /Audio/Machines/Nuke/angry_beep.ogg
        params:
          volume: -3
          rolloffFactor: 1.3
      soundRack:
        path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: IlluminateMagazineFlechette
          insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineFlechette
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - IlluminateCartridgeFlechette