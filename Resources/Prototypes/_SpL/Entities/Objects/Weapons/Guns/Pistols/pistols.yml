- type: entity
  id: WeaponIlluminateFrostbite
  parent: [ BaseWeaponPistol, BaseIlluminateContraband]
  name: PD52 "frostbite"
  description: A one-handed cross between handgun and SMG, chambered in unique ammunition, and the standard sidearm of the Illuminate. Comes with an inbuilt silencer.
  components:
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Pistols/frostbite.rsi
      layers:
        - state: base
          map: [ "enum.GunVisualLayers.Base" ]
        - state: mag-0
          map: [ "enum.GunVisualLayers.Mag" ]
    - type: AmmoCounter
    - type: Tag
      tags:
        - IlluminateTech
    - type: Item
      size: Small
      shape:
        - 0,0,1,1
    - type: Gun
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/hushpup.ogg
        params:
          volume: -2
          rolloffFactor: 1.3
      fireRate: 6
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
        - Burst
      shotsPerBurst: 3
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazinePistolSP
          insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineFlechette
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgeFlechette