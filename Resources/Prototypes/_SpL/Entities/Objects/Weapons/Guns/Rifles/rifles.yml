- type: entity
  name: M90 carbine
  parent: [BaseWeaponRifle, BaseSyndicateContraband]
  id: WeaponRifleM90Carbine
  description: An older bullpup carbine model for close to medium range engagements. Still quite effective despite its age, but mind the spread. Chambered in .20 rifle.
  components:
    - type: Gun
      soundGunshot:
        path: /Audio/_Starlight/Weapons/Guns/Gunshots/m90.ogg
      fireRate: 7
      selectedMode: Burst
      minAngle: 30
      maxAngle: 40
      angleIncrease: 2
      angleDecay: 5
      shotsPerBurst: 3
      burstFireRate: 14
      availableModes:
        - FullAuto
        - Burst
        - SemiAuto
    - type: GunWieldBonus
      minAngle: -28
      maxAngle: -25
    - type: Sprite
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Rifles/carbine.rsi
      layers:
        - state: base
          map: [ "enum.GunVisualLayers.Base" ]
        - state: mag-0
          map: [ "enum.GunVisualLayers.Mag" ]
    - type: Clothing
      sprite: /Textures/_SpL/Objects/Weapons/Guns/Rifles/carbine.rsi
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineRifleFMJ
          insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineRifle
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgeRifle
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot ""
        gun_chamber: !type:ContainerSlot ""
        firing_pin: !type:Container # starlight
    - type: MagazineVisuals
      magState: mag
      steps: 1
      zeroVisible: true
    - type: Appearance