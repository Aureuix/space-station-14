- type: entity
  parent: [ EncryptionKey, BaseGSLOwnedContraband ]
  id: EncryptionKeyGSL
  name: GSL shortband encryption key
  description: A shortband encryption key used by GSL personnel.
  components:
    - type: EncryptionKey
      channels:
        - GSL
      defaultChannel: GSL
    - type: Sprite
      layers:
        - sprite: _Starlight/Objects/Devices/encryption_keys.rsi
          state: crypt_brown
        - sprite: _SpL/Objects/Devices/encryption_keys.rsi
          state: gsl_label

- type: entity
  parent: [ EncryptionKey, BaseIlluminateContraband ]
  id: EncryptionKeyIlluminate
  name: Illuminate encryption key
  description: An encryption key used by nefarious space raptors.
  components:
    - type: EncryptionKey
      channels:
        - Illuminate
        - Common
        - Security
        - Command
      defaultChannel: Illuminate
    - type: Sprite
      layers:
        - sprite: Objects/Devices/encryption_keys.rsi
          state: crypt_orange
        - sprite: _SpL/Objects/Devices/encryption_keys.rsi
          state: illuminate_label