- type: entity
  name: GSL shortband radio
  description: A handy radio for telling the ATS technician that bad faith actors compromised your entire station's finances.
  parent: [ RadioHandheld, BaseCommandContraband ]
  id: RadioHandheldGSL
  components:
    - type: RadioMicrophone
      broadcastChannel: GSL
      listenRange: 1
    - type: RadioSpeaker
      channels:
        - GSL
    - type: Speech
      speechVerb: Robotic
    - type: Sprite
      sprite: _SpL/Objects/Devices/gslhandy.rsi
      layers:
        - state: walkietalkie
        - state: walkietalkie-on
      state: walkietalkie
    - type: Item
      sprite: _SpL/Objects/Devices/gslhandy.rsi
      heldPrefix: walkietalkie
    - type: Tag
      tags:
        - Radio

- type: entity
  name: strange radio
  description: Airwaves, airwaves...
  parent: [ RadioHandheld, BaseSyndicateContraband ]
  id: StrangeRadio
  components:
  - type: RadioMicrophone
    broadcastChannel: RedSun
    listenRange: 5
  - type: RadioSpeaker
    channels:
      - RedSun
  - type: TypingIndicator
    proto: xenoborg
  - type: ItemTogglePointLight
  - type: ItemToggle
    soundActivate:
      path: /Audio/_Starlight/Effects/Radio/marauder_agent.ogg
      params:
        volume: -2
    soundDeactivate:
      path: /Audio/_Starlight/Effects/Radio/marauder_commander.ogg
      params:
        volume: -2
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Ambience/Objects/hdd_buzz.ogg
      params:
        volume: -3
  - type: Sprite
    sprite: _SpL/Objects/Devices/strangeradio.rsi
    layers:
    - state: icon
    - state: icon_on
      shader: unshaded
      visible: false
      map: [ "on" ]
  - type: PointLight
    enabled: false
    radius: 2
    energy: 1.5
    falloff: 2
    color: "#bb0000"
    netsync: false
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: on
  - type: Item
    sprite: _SpL/Objects/Devices/strangeradio.rsi