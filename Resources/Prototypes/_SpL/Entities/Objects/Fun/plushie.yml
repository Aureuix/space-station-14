- type: entity
  parent: BaseVulpkaninFoxPlushie
  id: PlushieKanna
  name: kanna plushie
  description: A strange, lemon-scented plushie. Letting her into the chemistry lab surely couldn't result in anything bad happening.
  components:
    - type: Item
      size: Small
      sprite: _SpL/Objects/Fun/Plushies/kanna_plushie.rsi
    - type: Sprite
      sprite: _SpL/Objects/Fun/Plushies/kanna_plushie.rsi
      state: icon
    - type: ItemToggle
      activated: true
      onUse: false
      verbToggleOn: plushie-voicebox-activate
      verbToggleOff: plushie-voicebox-deactivate
    - type: ComponentToggler
      components:
        - type: DatasetVocalizer
          dataset: PlushiesKanna
    - type: Vocalizer
      minVocalizeInterval: 600
      maxVocalizeInterval: 1200

- type: entity
  parent: BaseVulpkaninFoxPlushie
  id: PlushieVogel
  name: vogel plushie
  description: The latest from Syndicate High Command's ground team; Their fluffiest representative, now in plushie form. The tag says, "Revolver not included."
  components:
    - type: Item
      size: Small
      sprite: _SpL/Objects/Fun/Plushies/vogel_plushie.rsi
    - type: Sprite
      sprite: _SpL/Objects/Fun/Plushies/vogel_plushie.rsi
      state: icon

- type: entity
  parent: BaseAvaliPlushie
  id: PlushieEini
  name: eini plushie
  description: A small plushie of everyone's favorite hardworking Avali. Surely this one won't overwork herself too...? The tag warns you against trying to remove her scarf.
  components:
    - type: Item
      size: Small
      sprite: _SpL/Objects/Fun/Plushies/eini_plushie.rsi
    - type: Sprite
      sprite: _SpL/Objects/Fun/Plushies/eini_plushie.rsi
      state: icon
    - type: ItemToggle
      onUse: false
      activated: true
      verbToggleOn: plushie-voicebox-activate
      verbToggleOff: plushie-voicebox-deactivate
    - type: ComponentToggler
      components:
        - type: DatasetVocalizer
          dataset: PlushiesEini
    - type: Vocalizer
      minVocalizeInterval: 120
      maxVocalizeInterval: 240
    - type: LanguageSpeaker
    - type: LanguageKnowledge
      speaks:
        - GalacticCommon
        - Scratch
      understands:
        - Scratch
        - GalacticCommon

- type: entity
  parent: BaseShadekinPlushie
