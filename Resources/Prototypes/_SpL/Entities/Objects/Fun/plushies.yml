- type: entity
  parent: PlushieArachind
  id: PlushieOomu
  name: oomu plushie
  description: A plushie depicting everyone's favourite Research Director, complete with a removable hardsuit and light. Keeping charcoal on-hand is highly advised while handling.
  components:
    - type: Item
      size: Small
      sprite: _SpL/Objects/Fun/Plushies/oomu_plushie.rsi
    - type: Sprite
      sprite: _SpL/Objects/Fun/Plushies/oomu_plushie.rsi
      layers:
        - state: icon
        - state: icon_suited
          visible: false
          map: [ "suited" ]
    - type: ItemTogglePointLight
    - type: ItemToggle
      soundActivate:
        path: /Audio/Mecha/mechmove03.ogg
        params:
          volume: -4
      soundDeactivate:
        path: /Audio/Mecha/mechmove03.ogg
        params:
          volume: -4
    - type: Appearance
    - type: PointLight
      enabled: false
      radius: 2
      energy: 2
      color: white
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      netsync: false
    - type: ToggleableVisuals
      spriteLayer: suited
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Lexorin 
            Quantity: 1
            
- type: entity
  parent: BaseShadekinPlushie
  id: PlushieParadigm
  name: paradigm plushie
  description: A plushie of a dear little Kin. It's soothing and very soft!!
  components:
    - type: Item
      size: Small
      sprite: _SpL/Objects/Fun/Plushies/paradigm_plushie.rsi
    - type: Sprite
      sprite: _SpL/Objects/Fun/Plushies/paradigm_plushie.rsi
      state: icon
    - type: EmitSoundOnUse
      sound:
        path: /Audio/_Starlight/Voice/Shadekin/wurble.ogg
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_Starlight/Voice/Shadekin/wurble.ogg
    - type: EmitSoundOnActivate
      sound:
        path: /Audio/_Starlight/Voice/Shadekin/wurble.ogg
    - type: EmitSoundOnTrigger
      sound:
        path: /Audio/_Starlight/Voice/Shadekin/wurble.ogg
    - type: UseDelay
      delay: 1
    - type: MeleeWeapon
      wideAnimationRotation: 180
      soundHit:
        path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
      damage:
        types:
          Blunt: 0
      hidden: true    
    - type: Edible
      requiresSpecialDigestion: true
      useSound: /Audio/_Starlight/Voice/Felionoid/cat_mew3.ogg
      delay: 2
    - type: Extractable
      juiceSolution: # To create a Silencer when juiced with a Dirt plushie!
        reagents:
        - ReagentId: Cream
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 10
    - type: ItemToggle
      onUse: false
      activated: true
      verbToggleOn: plushie-voicebox-activate
      verbToggleOff: plushie-voicebox-deactivate
    - type: ComponentToggler
      components:
        - type: DatasetVocalizer
          dataset: PlushiesParadigm
    - type: Vocalizer
      minVocalizeInterval: 180
      maxVocalizeInterval: 240
    - type: SpamEmitSound
      sound:
        path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
      minInterval: 180
      maxInterval: 240
    - type: LanguageSpeaker
    - type: LanguageKnowledge
      speaks:
        - GalacticCommon
        - Marish
        - Moffic
      understands:
        - GalacticCommon
        - Marish
        - Moffic

