      severity: GSLOwned
      allowedJobs: [ GSLTechnician ]
    
- type: entity
  id: BaseIlluminateContraband
  abstract: true
  components:
    - type: Contraband
      severity: Illuminate
      allowedDepartments: [ CentralCommand ]