- type: entity
  parent: WeatherBase
  id: WeatherAshfallHeavyDamage
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/Effects/weather.rsi
      state: ashfall_heavy
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -6
  - type: WeatherEffects
  - type: WeatherEntityEffect
    effects:
    - !type:Flash
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
    - !type:HealthChange
      ignoreResistances: false
      damage:
        types:
          Heat: 1

