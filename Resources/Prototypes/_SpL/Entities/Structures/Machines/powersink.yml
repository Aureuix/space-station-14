- type: entity
  id: SyndicateCryptoMiner
  parent: [BaseMachine, BaseSyndicateContraband]
  name: cryptanalytic computer
  description: Drains immense amounts of electricity from the grid for use against NanoTrasen cryptography. 
  components:
    - type: NodeContainer
      examinable: true
      nodes:
        input:
          !type:CableDeviceNode
          nodeGroupID: HVPower
    - type: Transform
      anchored: true
    - type: Physics
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.40,-0.40,0.40,0.40"
          density: 90
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 500
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: PowerSink
    - type: Battery
      netsync: false
      maxCharge: 10000000000000 # SpL- it really shouldn't ever run out
      pricePerJoule: 0.000009
    - type: ExaminableBattery
    - type: PowerConsumer
      voltage: High
      drawRate: 250000
    - type: Sprite
      sprite: Structures/Machines/traitordm.rsi
      layers:
      - state: redemption
      - state: redemption-unshaded
        shader: unshaded
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - type: Tag
      tags:
        - GhostOnlyWarp
    - type: WarpPoint
      location: redspace computer
      blacklist:
        tags:
          - GhostOnlyWarp
    - type: StaticPrice
      price: 3000
      
- type: entity
  id: SyndicateResearchAppropriator
  parent: [ BaseResearchAndDevelopmentPointSource, BaseSyndicateContraband ]
  name: research appropriator
  description: Siphons and transfers research generated by station scientists to Syndicate-aligned facilities.
  components:
    - type: ResearchPointSource
      pointspersecond: -12
      active: true