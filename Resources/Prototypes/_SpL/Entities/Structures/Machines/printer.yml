- type: entity
  parent: PrinterDoc
  id: PrinterDocGSL
  name: GSL document printer
  description: Bureaucratic perfection. Stores a database of GSL's documents, and lets you print them as long as you have paper.
  components:
    - type: Sprite
      sprite: _SpL/Structures/Machines/gslprinter.rsi
      snapCardinals: true
      layers:
        - state: icon
          map: [ "enum.LatheVisualLayers.IsRunning" ]
        - state: idle
          shader: unshaded
          map: [ "enum.PowerDeviceVisualLayers.Powered" ]
        - state: inserting
          map: [ "enum.MaterialStorageVisualLayers.Inserting" ]
        - state: panel
          map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    - type: Machine
      board: GSLPrinterDocMachineCircuitboard
    - type: Lathe
      producingSound: /Audio/Machines/scanning.ogg
      idleState: icon
      runningState: building
      staticPacks:
        - GSLDocs
    - type: EmagLatheRecipes
      emagStaticPacks:
        - SpLDocsEmag

- type: entity
  parent: PrinterDoc
  id: PrinterDocSHC
  name: blood-red document printer
  description: A sinister redspace printer designed solely for printing one document type and nothing else. Pure evil.
  components:
    - type: Sprite
      sprite: _SpL/Structures/Machines/shcprinter.rsi
      snapCardinals: true
      layers:
        - state: icon
          map: [ "enum.LatheVisualLayers.IsRunning" ]
        - state: idle
          shader: unshaded
          map: [ "enum.PowerDeviceVisualLayers.Powered" ]
        - state: inserting
          map: [ "enum.MaterialStorageVisualLayers.Inserting" ]
        - state: panel
          map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    - type: Machine
      board: SHCPrinterDocMachineCircuitboard
    - type: Lathe
      producingSound: /Audio/Machines/scanning.ogg
      idleState: icon
      runningState: building
      staticPacks:
        - SHCDocs
    - type: MaterialStorage
      whitelist:
        tags:
          - Document
      storage:
        SheetPrinter: 100

