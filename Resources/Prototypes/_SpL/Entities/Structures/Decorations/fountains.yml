- type: entity
  parent: BaseStructure
  name: lava fountain
  description: Refilling your water from this is highly inadvisable.
  id: FountainLava
  components:
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: "1.5"
          density: 60
          mask:
            - MachineMask
          layer:
            - MidImpassable
            - LowImpassable
    - type: Sprite
      noRot: true
      sprite: _DV/Structures/Decoration/lavafountains.rsi
      offset: 0,-0.1
      layers:
        - state: large-round-base
        - state: large-round-base-lava
        - state: large-round-top
        - state: large-round-flows
        - state: large-round-top-lava
    - type: Appearance
    - type: PointLight
      radius: 5
      energy: 3
      color: "#FFC90C"
    - type: AmbientSound
      volume: -2
      range: 10
      sound:
        path: /Audio/Ambience/Objects/fireplace.ogg
    - type: AlwaysHot
    - type: IgnitionSource
      temperature: 2000
      ignited: true