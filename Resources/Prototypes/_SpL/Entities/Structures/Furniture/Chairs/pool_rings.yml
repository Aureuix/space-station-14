- type: entity
  abstract: true
  parent: [UnanchoredChairBase, BaseItem]
  id: BaseSwimRing
  name: pool ring
  description: An inflatable rubber toy for resting on top of the water. 
  components:
    - type: Sprite
      sprite: _DEN/Structures/Furniture/pool_ring.rsi
    - type: Clothing
      sprite: _DEN/Structures/Furniture/pool_ring.rsi
      slots:
        - belt
    - type: Item
      size: Normal
      sprite: _DEN/Structures/Furniture/pool_ring.rsi
      
