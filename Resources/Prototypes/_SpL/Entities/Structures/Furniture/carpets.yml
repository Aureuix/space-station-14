- type: entity
  parent: CarpetBase
  id: CarpetTatami
  name: tatami
  description: This was once a luxury reserved solely for nobles. Now, it's... still a luxury, just for different reasons.
  components:
    - type: Sprite
      sprite: Nyanotrasen/Furniture/tatami.rsi
      drawdepth: FloorTiles
    - type: Icon
      sprite: Nyanotrasen/Furniture/tatami.rsi
      state: full
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 10
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                FloorCarpetItemTatami:
                  min: 1
                  max: 1