- type: entity
  parent: [ ClothingMaskGas, BaseCentcommContraband ]
  id: ClothingMaskGasCBURN
  name: CBURN filtration mask
  description: A modernised, airtight multifilter gas mask based on standard issue gear from the Pod Wars.
  components:
    - type: Sprite
      sprite: _SpL/Clothing/Mask/cburn.rsi
    - type: Clothing
      sprite: _SpL/Clothing/Mask/cburn.rsi
    - type: HideLayerClothing
      slots:
        - Hair
        - Snout
      hideOnToggle: true
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.95
          Slash: 0.95
          Piercing: 0.95
          Heat: 0.90
          Cold: 0.90
          Shock: 0.90
          Radiation: 0.90
          Caustic: 0.90
    - type: IdentityBlocker
      coverage: MOUTH
    - type: ZombificationResistance
      zombificationResistanceCoefficient: 0.9
      
- type: entity
  parent: [ ClothingMaskGas, BaseCentcommContraband ]
  id: ClothingMaskDigitalVisor
  name: digital visor
  description: A visored full-head mask, practically a helmet. Possibly worn as a fashion statement, or to conceal a major injury.
  components:
    - type: Sprite
      sprite: _SpL/Clothing/Mask/halcy.rsi
    - type: Clothing
      sprite: _SpL/Clothing/Mask/halcy.rsi
    - type: FlashImmunity
      blocksSpecialVision: False
    - type: EyeProtection
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.95
          Slash: 0.95
          Piercing: 0.95
          Heat: 0.95