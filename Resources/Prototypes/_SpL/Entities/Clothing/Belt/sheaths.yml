- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseCommandContraband]
  id: CentcommVibroRapierSheath
  name: CentComm vibrorapier sheath
  description: An ornate sheath for holding a Vibrorapier. This model was designed based on field trials of the Vibroblade and its dedicated sheath, and adapted to the unique needs of the artwork it was designed to store.
  components:
  - type: Sprite
    sprite: _SpL/Clothing/Belt/VibrorapierSheath.rsi
    state: sheath
  - type: Clothing
    sprite: _SpL/Clothing/Belt/VibrorapierSheath.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: Sword
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - VibroRapier
  - type: ItemMapper
    mapLayers:
      sheath-sword:
        whitelist:
          tags:
          - VibroRapier
  - type: Appearance

- type: entity
  parent: CentcommVibroRapierSheath
  id: CentcommVibroRapierSheathFilled
  name: CentComm vibrorapier sheath
  suffix: Filled
  components:
    - type: ContainerFill
      containers:
        item:
          - VibroRapier

