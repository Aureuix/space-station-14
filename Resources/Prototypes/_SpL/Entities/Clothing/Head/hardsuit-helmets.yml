- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, ClothingHeadLightParamsAdvanced ]
  id: ClothingHeadHelmetHardsuitGSLSpatio
  categories: [ HideSpawnMenu ]
  name: VI-037M spationaut helmet
  description: A sturdy helmet designed for complex industrial operations in space.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/Head/Hardsuits/spatiohelm.rsi
      layers:
        - state: icon
        - state: icon-unshaded
          shader: unshaded
        - state: light-overlay
          visible: false
          shader: unshaded
          map: [ "light" ]
    - type: HandheldLight
      addPrefix: false
    - type: ToggleableVisuals
      clothingVisuals:
        head:
          - state: equipped-head-light
            shader: unshaded
        head-vox:
          - state: equipped-head-light-vox
            shader: unshaded
        head-vulpkanin:
          - state: equipped-head-light-vulpkanin
            shader: unshaded
        head-dog:
          - state: equipped-head-light-dog
            shader: unshaded
    - type: Clothing
      clothingVisuals:
        head:
          - state: equipped-head
          - state: equipped-head-unshaded
            shader: unshaded
        head-vox:
          - state: equipped-head-vox
          - state: equipped-head-unshaded-vox
            shader: unshaded
        head-vulpkanin:
          - state: equipped-head-vulpkanin
          - state: equipped-head-unshaded-vulpkanin
            shader: unshaded
        head-dog:
          - state: equipped-head-dog
          - state: equipped-head-unshaded-dog
            shader: unshaded
    - type: PressureProtection
      highPressureMultiplier: 0.72
      lowPressureMultiplier: 1000
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
    - type: Tag
      tags:
        - CorgiWearable
        - WhitelistChameleon

