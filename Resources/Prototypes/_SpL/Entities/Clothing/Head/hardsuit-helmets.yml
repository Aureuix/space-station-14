  id: ClothingHeadHelmetHardsuitCSElite
  categories: [ HideSpawnMenu ]
  name: CyberSun elite helmet
  description: A sleek armored helmet, paired with its equally stylish and menacing hardsuit counterpart.
  components:
  - type: Sprite
    sprite:  _SpL/Clothing/Head/Hardsuits/CybersunElite.rsi
  - type: Clothing
    sprite:  _SpL/Clothing/Head/Hardsuits/CybersunElite.rsi
  - type: PointLight
    color: purple
