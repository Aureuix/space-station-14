  id: ClothingHeadHelmetHardsuitCSElite
  categories: [ HideSpawnMenu ]
  name: CyberSun elite helmet
  description: A sleek armored helmet, paired with its equally stylish and menacing hardsuit counterpart.
  components:
  - type: Sprite
    sprite:  _SpL/Clothing/Head/Hardsuits/CybersunElite.rsi
  - type: Clothing
    sprite:  _SpL/Clothing/Head/Hardsuits/CybersunElite.rsi
  - type: PointLight
    color: purple
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: FireProtection
    reduction: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.9
        Heat: 0.85
  - type: Tag
    tags:
    - WhitelistChameleon

