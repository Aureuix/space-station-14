- type: entity
  parent: [ ClothingHeadLightBase, BaseSyndicateContraband, ClothingHeadLightParamsAdvanced ]
  id: ClothingHeadHelmetSyndicateAssault
  name: Syndicate assault helmet
  description: A robust, in-atmosphere combat-rated helmet with a built-in light and a sinister red paint job. Although not rated for space travel, it is capable of airtight sealing in an emergency.
  components:
    - type: Sprite
      sprite: _SpL/Clothing/Head/Helmets/syndie_assault.rsi
    - type: Clothing
      sprite: _SpL/Clothing/Head/Helmets/syndie_assault.rsi
      clothingVisuals:
        head:
          - state: off-equipped-HELMET
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellUltra
          blacklist:
            tags:
              - MechReactor
    - type: HideLayerClothing
      layers:
        Hair: HEAD
        HeadTop: HEAD
        HeadSide: HEAD
    - type: PointLight
      color: "#50ff50"
    - type: PressureProtection
      highPressureMultiplier: 0.08
      lowPressureMultiplier: 1000
    - type: ToggleableVisuals
      clothingVisuals:
        head:
          - state: on-equipped-HELMET
            shader: unshaded
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.80
          Slash: 0.80
          Piercing: 0.80
          Heat: 0.80
          Radiation: 0.80
          Caustic: 0.95