- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesGlassesDiagnostic
  name: prescription diagnostic hud
  description: A pair of prescription glasses capable of analyzing the integrity and status of robotics and exosuits. Made out of see-borg-ium.
  components:
    - type: Sprite
      sprite: _SpL/Clothing/Eyes/Glasses/diagglasses.rsi
    - type: Clothing
      sprite: _SpL/Clothing/Eyes/Glasses/diagglasses.rsi
    - type: ShowHealthBars
      damageContainers:
        - Inorganic
        - Silicon
        - IPC
    - type: ShowAccessReaderSettings
    - type: VisionCorrection

- type: entity
  parent: [ClothingEyesBase, BaseCommandContraband]
  id: ClothingEyesGlassesCommandPrescription
  name: prescription administrative glasses
  description: A set of unshielded prescription glasses for Command staff.
  components:
    - type: Sprite
      sprite: _SpL/Clothing/Eyes/Glasses/prescriptioncommandglasses.rsi
    - type: Clothing
      sprite: _SpL/Clothing/Eyes/Glasses/prescriptioncommandglasses.rsi
    - type: VisionCorrection
    - type: ShowAccess
    - type: ShowJobIcons
    - type: StealTarget
      stealGroup: RareGlassesCollection
      
- type: entity
  parent: [ClothingEyesBase, BaseCommandContraband]
  id: ClothingEyesGlassesCommandJamjar
  name: administrative jamjar glasses
  description: A set of unshielded glasses for wide-eyed commanders.
  components:
    - type: Sprite
      sprite: _SpL/Clothing/Eyes/Glasses/jamjarcommand.rsi
    - type: Clothing
      sprite: _SpL/Clothing/Eyes/Glasses/jamjarcommand.rsi
    - type: VisionCorrection
    - type: ShowAccess
    - type: ShowJobIcons
    - type: StealTarget
      stealGroup: RareGlassesCollection

- type: entity
  parent: [ ClothingEyesBase, BaseGSLOwnedContraband ]
  id: ClothingEyesGlassesGSL
  name: GSL technical infoshades
  description: Anti-fraud glasses with NanoTrasen employee identification elements inbuilt. Developed as a joint NT-GSL venture following a string of recent trade incidents in the sector.
  components:
    - type: Sprite
      sprite: Clothing/Eyes/Glasses/commandglasses.rsi
    - type: Clothing
      sprite: Clothing/Eyes/Glasses/commandglasses.rsi
    - type: EyeProtection
      protectionTime: 8
    - type: ShowJobIcons
    - type: IdentityBlocker
      coverage: EYES

- type: entity
  parent: [ ClothingEyesBase, BaseEngineeringSalvageContraband ]
  id: ClothingEyesGlassesTRayMeson
  name: advanced engineering goggles 
  description: Lime-tinted eclipse-rated advanced goggles with a proprietary eye-protecting polymer, upgraded with T-Ray visual scanning and visual diagnostics.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Eyes/Glasses/traymeson.rsi
    - type: Clothing
      sprite: DeltaV/Clothing/Eyes/Glasses/traymeson.rsi
      quickEquip: true
    - type: EyeProtection
    - type: FlashImmunity
    - type: IdentityBlocker
      coverage: EYES
    - type: ItemToggle
      soundActivate: 
        path: /Audio/Machines/machine_switch.ogg
        params:
          volume: -3
      soundDeactivate: 
        path: /Audio/Machines/button.ogg
        params:
          volume: -3
      verbToggleOn: item-toggle-enable-tray
      verbToggleOff: item-toggle-disable-tray
      onUse: false
    - type: ComponentToggler
      components:
        - type: TrayScanner
          enabled: true
    - type: ShowHealthBars
      damageContainers:
        - Inorganic
        - Silicon
        - IPC # SL
    - type: ShowAccessReaderSettings
    - type: Tag
      tags:
        - PetWearable
        - WhitelistChameleon
        - Meson
    - type: StealTarget
      stealGroup: RareGlassesCollection