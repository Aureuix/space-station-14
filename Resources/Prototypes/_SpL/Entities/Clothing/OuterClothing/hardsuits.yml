- type: entity
  parent: [ClothingOuterHardsuitBase, BaseSyndicateContraband ]
  id: ClothingOuterHardsuitCSElite
  name: CS-174 CyberSun elite suit
  description: A suit made by CyberSun's R&D department, who decided to one-up the Gorlex Marauders in the world of advanced hardsuits. Comes with a battery-powered energy shield generator built in.
  components:
  - type: Sprite
    sprite: _SpL/Clothing/OuterClothing/Hardsuits/CybersunElite.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _SpL/Clothing/OuterClothing/Hardsuits/CybersunElite.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: FireProtection
    reduction: 0.8
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.25
        Radiation: 0.01
        Caustic: 0.4
    staminaModifier: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitCSElite
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      toggleable-clothing: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        whitelist:
          tags:
            - PowerCellSmall
            - PowerCell
  - type: EnergyDomeGenerator
    damageEnergyDraw: 24
    domePrototype: EnergyDomeSmallPink
  - type: PowerCellDraw
    enabled: false
    drawRate: 8
  - type: UseDelay
    delay: 10.0
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: StaticPrice
    price: 5000
    
- type: entity
  parent: ClothingOuterHardsuitSecurity
  id: ClothingOuterHardsuitDetective
  name: detective hardsuit
  description: A standard issue security suit with armour plating cut down in favour of a stylish trenchcoat and hat.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/detective.rsi
    - type: Clothing
      sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/detective.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.6
          Heat: 0.7
          Caustic: 0.7
      staminaModifier: 0.7
    - type: ClothingSpeedModifier
      walkModifier: 0.8
      sprintModifier: 0.8
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitDetective
    - type: StealTarget 
      stealGroup: BrigmedicHardsuit
      
- type: entity
  parent: [ ClothingOuterHardsuitBase, AllowSuitStorageClothing, BaseToggleClothing, BaseUnknownContraband ]
  id: ClothingOuterHardsuitVoxRaider
  name: ARK infiltration suit
  description: A strange, lightweight and ominous looking hardsuit with camoflauging capabilities. It seems fitted specifically to vox proportions.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/vox-raiders-stealth.rsi
    - type: Clothing
    - type: Item
      size: Huge
      sprite: _Goobstation/Clothing/OuterClothing/Hardsuits/vox-raiders-stealth.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.525
      lowPressureMultiplier: 10000
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.6
          Heat: 0.6
          Radiation: 0.6
          Caustic: 0.6
      staminaModifier: 0.3
    - type: ExplosionResistance
      damageCoefficient: 0.5
    - type: ToggleClothing
      action: ActionTogglePhaseCloak
      disableOnUnequip: true
    - type: ComponentToggler
      parent: true
      components:
        - type: Stealth
          minVisibility: 0.15
          maxVisibility: 0.15
          lastVisibility: 0.15
    - type: PowerCellDraw
      drawRate: 10
    - type: ToggleCellDraw
    - type: PowerCellSlot
      cellSlotId: cell_slot
      fitsInCharger: false
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
        toggleable-clothing: !type:ContainerSlot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellAntiqueProto
          disableEject: true
          swap: false
          whitelist:
            tags:
              - PowerCell
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitVoxRaider
    - type: Tag
      tags:
        - Hardsuit
        - BlacklistChameleon
      
