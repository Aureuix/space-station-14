- type: entity
  parent: [ClothingOuterHardsuitBase, BaseSyndicateContraband ]
  id: ClothingOuterHardsuitCSElite
  name: CS-174 CyberSun elite suit
  description: A suit made by CyberSun's R&D department, who decided to one-up the Gorlex Marauders in the world of advanced hardsuits. Comes with a battery-powered energy shield generator built in.
  components:
  - type: Sprite
    sprite: _SpL/Clothing/OuterClothing/Hardsuits/CybersunElite.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _SpL/Clothing/OuterClothing/Hardsuits/CybersunElite.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: FireProtection
    reduction: 0.8
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.25
        Radiation: 0.01
        Caustic: 0.4
    staminaModifier: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitCSElite
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      toggleable-clothing: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        whitelist:
          tags:
            - PowerCellSmall
            - PowerCell
  - type: EnergyDomeGenerator
    damageEnergyDraw: 24
    domePrototype: EnergyDomeSmallPink
  - type: PowerCellDraw
    enabled: false
    drawRate: 8
  - type: UseDelay
    delay: 10.0
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: StaticPrice
    price: 5000
    
# Elite ERT suit
- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseCentcommContraband ]
  id: ClothingOuterHardsuitSVSElite
  name: SVS-27C combat tacsuit
  suffix: ADMEME
  description: A highly protective combat suit worn by members of a Central Command Special Operations fireteam. Once a mainstay of the organisation, these corporate-war era suits have become rarer in recent decades, now being deployed solely for existential threats. # SpL
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/OuterClothing/Hardsuits/ERTSuits/eliteert.rsi
    - type: Clothing
      sprite: DeltaV/Clothing/OuterClothing/Hardsuits/ERTSuits/eliteert.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.02
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.001
      coolingCoefficient: 0.001
    - type: ExplosionResistance
      damageCoefficient: 0.2
    - type: FireProtection
      reduction: 0.8
    - type: StaminaResistance
      damageCoefficient: 0.8
    - type: Pierceable
      level: Rock
    - type: ZombificationResistance
      zombificationResistanceCoefficient: 0.8
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.4
          Slash: 0.4
          Piercing: 0.35
          Heat: 0.35
          Radiation: 0.5
          Caustic: 0.4
      staminaModifier: 0.2
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepHeavy
        params:
          volume: -6
          variation: 0.09
    - type: Item
      size: Huge
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 0.9
    - type: HeldSpeedModifier
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitSVSElite
    - type: Tag
      tags:
        - Hardsuit
      
      
