          Slash: 0.35
          Piercing: 0.30
          Heat: 0.35
          Radiation: 0.35
          Caustic: 0.35
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitSVSEliteLeader
    - type: ContainerContainer
