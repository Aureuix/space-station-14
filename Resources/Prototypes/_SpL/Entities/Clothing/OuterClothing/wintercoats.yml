# Goob stuff
- type: entity
  parent: [ ClothingOuterColdBase, AllowSuitStorageClothing, ClothingOuterStorageBase, BaseBlueShieldContraband ]
  id: ClothingOuterWinterBlueShield
  name: blueshield winter greatcoat
  description: A stylish bright windbreaker worn by Blueshield Officers escorting personnel in subzero conditions. Heavily reinforced, for when diplomacy won't cut it.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Coats/bso_winter_coat.rsi
    - type: Clothing
      sprite: _Goobstation/Clothing/OuterClothing/Coats/bso_winter_coat.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.6
          Slash: 0.6
          Piercing: 0.6
          Heat: 0.7
          Cold: 0.7
    - type: TemperatureProtection
      heatingCoefficient: 1.1
      coolingCoefficient: 0.35
    - type: ExplosionResistance
      damageCoefficient: 0.80
    - type: Item

- type: entity
  parent: [ClothingOuterStorageBase, ClothingOuterColdBase, BaseCommandContraband]
  id: ClothingOuterWinterCaptainArctic
  name: captain's frigid greatcoat
  description: A large, incredibly insulated winter coat, reinforced with a layer of armor. This would be incredibly out of place on most space stations.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Coats/cap_armored_winter_coat.rsi
    - type: Clothing
      sprite: _Goobstation/Clothing/OuterClothing/Coats/cap_armored_winter_coat.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.7
          Heat: 0.6
          Cold: 0.5
          Caustic: 0.5
    - type: TemperatureProtection
      heatingCoefficient: 1.2
      coolingCoefficient: 0.2
      
