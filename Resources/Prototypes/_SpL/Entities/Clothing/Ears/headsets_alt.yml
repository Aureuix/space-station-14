- type: entity
  parent: [ClothingHeadsetAlt, BaseSyndicateContraband]
  id: ClothingHeadsetAltSyndicateListener
  name: blood-red over-ear listening headset
  suffix: ADMEME
  description: An updated, modular syndicate intercom that fits over the head, pre-loaded with a stolen masterkey.
  components:
    - type: Headset
    - type: EncryptionKeyHolder
      keySlots: 5
    - type: ContainerFill
      containers:
        key_slots:
          - EncryptionKeySyndie
          - EncryptionKeyStationMaster
    - type: Sprite
      sprite: Clothing/Ears/Headsets/syndicate.rsi
    - type: Clothing
      sprite: Clothing/Ears/Headsets/syndicate.rsi
    - type: RadioChime
      sound:
        path: /Audio/_SpL/Effects/Radio/syndicate.ogg
    - type: Tag
      tags:
        - BlacklistChameleon # SpL
        
