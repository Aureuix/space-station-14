    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Pacified
    - RadiationProtection
    - Drowsiness
  - type: ComplexInteraction

  - type: Changeling
  - type: ChangelingDevour
  - type: ChangelingIdentity
  - type: ChangelingTransform
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          # Circles, cuz rotation of rectangles looks very bad
          !type:PhysShapeCircle
          radius: 0.75
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer

  - type: Brighteye
    energy: 200
  - type: Shadekin
    thresholds:
      0.8: Low
      5: Annoying
      10: High
      15: Extreme

  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
  - type: Hands