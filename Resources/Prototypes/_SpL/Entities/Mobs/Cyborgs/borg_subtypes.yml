# Syndicate Tallborgs
# Each sprite type matched with a subtype for convenience's sake
- type: entity
  parent: BorgChassisSyndicateStealth
  id: BorgChassisSyndicateStealthTall
  name: syndicate stealth cyborg
  description: A cyborg chassis built by the Syndicate for stealth operations. Its charming chassis should hopefully result in smoother infiltration of the crew.
  components:
      - type: Sprite
        sprite: _Starlight/Mobs/Silicon/Chassis/tallborgs/tallborgs-syndie/mmeka_syndie.rsi
        layers:
          - state: borg
          - state: borg_e
            map: [ "enum.BorgVisualLayers.Light" ]
            shader: unshaded
            visible: false
          - state: borg_l
            shader: unshaded
            map: [ "light" ]
            visible: false
      - type: ContainerFill
        containers:
          borg_brain:
            - PositronicBrain
          borg_module:
            - BorgModuleTool
            - BorgModuleSyndicateChameleonProjector
            - BorgModuleSyndicateStealth
            - BorgModuleOperative
            - BorgModuleSyndicateNukeDisk
          cell_slot:
            - PowerCellHyper
            
