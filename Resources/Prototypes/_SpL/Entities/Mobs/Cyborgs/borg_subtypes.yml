# NTNC Tallborgs
- type: entity
  parent: BaseBorgChassisNotIonStormable
  id: NTNCtallborgSF
  name: NTNC cyborg chassis
  description: An advanced cyborg chassis used by the NanoTrasen Navy Corps on ship operations.
  components:
    # - type: TextToSpeech # SpL
    - type: Sprite
      sprite: _Starlight/Mobs/Silicon/Chassis/tallborgs/tallborgs-peace/sfmeka_peace.rsi
      layers:
        - state: borg
        - state: borg_e
          map: [ "enum.BorgVisualLayers.Light" ]
          shader: unshaded
          visible: false
        - state: borg_l
          shader: unshaded
          map: [ "light" ]
          visible: false
    - type: NpcFactionMember
      factions:
        - NanoTrasenSilicon
    - type: Access
      enabled: false
      groups:
        - AllAccess
      tags:
        - CentralCommand
    - type: AccessReader
      access: [["CentralCommand"]]
    - type: ShowJobIcons
    - type: InteractionPopup
      interactSuccessSound:
        path: /Audio/Ambience/Objects/periodic_beep.ogg
    - type: Speech
      speechVerb: Robotic
      speechSounds: Xenoborg
      allowedEmotes:
        - Laugh
    - type: Vocal
      sounds:
        Unsexed: UnisexSiliconXenoborg
    - type: FlashImmunity
    - type: IntrinsicRadioTransmitter
      channels:
        - Binary
        - CentCom
        - Common
        - Command
        - Engineering
        - Medical
        - Science
        - Security
        - Service
        - Supply
        - Law
        - NanoTrasen
    - type: ActiveRadio
      channels:
        - Binary
        - CentCom
        - Common
        - Command
        - Engineering
        - Medical
        - Science
        - Security
        - Service
        - Supply
        - Law
        - NanoTrasen
    - type: SiliconLawProvider
      laws: NTNCLawset
    - type: ShowHealthBars
      damageContainers:
        - Biological
        - Inorganic
        - Silicon
    - type: ShowHealthIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons     
    - type: BorgChassis
      maxModules: 5
      moduleWhitelist:
        tags:
          - BorgModuleGeneric
          - BorgModuleCentcomm
          - BorgModuleEngineering
      hasMindState: borg_e
      noMindState: borg_e_r
    - type: MobThresholds 
      thresholds:
        0: Alive
        150: Critical
        300: Dead
      stateAlertDict:
        Alive: BorgHealth
        Critical: BorgCrit
        Dead: BorgDead
      showOverlays: false
      allowRevives: true
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 125
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                path: /Audio/Machines/warning_buzzer.ogg
                params:
                  volume: 5
        - trigger:
            !type:DamageTrigger
            damage: 450
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:EmptyContainersBehaviour
              containers:
                - borg_brain
                - borg_module
                - cell_slot
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: ContainerFill
      containers:
        borg_brain:
          - PositronicBrain
        borg_module: 
          - CentcommModuleSpaceMovement
          - CentcommBulwarkModule
          - CentcommAccessBreakerModule
          - CentcommLaserModule
          - BorgModuleAdvancedTool
        cell_slot:
          - PowerCellMicroreactor
        
