- type: reagent
  id: Methylxanthine # this is literally just the base compound of all caffeinated and methylated shit ever
  name: reagent-name-methylxanthine
  group: Narcotics
  desc: reagent-desc-methylxanthine
  physicalDesc: reagent-physical-desc-powdery
  contrabandSeverity: Minor
  allowedDepartments: 
  - Medical
  flavor: bitter
  color: "#FFFFFF"
  metabolisms:
    Narcotic:
      metabolismRate: 0.25
      effects:
        - !type:GenericStatusEffect
          key: Adrenaline
          component: IgnoreSlowOnDamage
          time: 3
          type: Add
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 20
        - !type:Jitter
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 15
        - !type:MovementSpeedModifier
          walkSpeedModifier: 1.15
          sprintSpeedModifier: 1.15
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 15
        - !type:ModifyStatusEffect
          effectProto: StatusEffectStunned
          time: 1
          type: Remove
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 15
        - !type:ModifyKnockdown
          time: 1
          type: Remove
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 15
        - !type:PopupMessage
          type: Local
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 15
          visualType: MediumCaution
          messages:
            - "ephedrine-effect-tight-pain"
            - "ephedrine-effect-heart-pounds"
          probability: 0.4
        - !type:SatiateThirst
          factor: -1
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 15
        - !type:HealthChange
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 21
          damage:
            types:
              Poison: 3
    Medicine:
      metabolismRate: 0.25
      effects:
        - !type:ModifyStatusEffect
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 5
          effectProto: StatusEffectDrowsiness
          time: 1
          type: Remove
        - !type:ModifyStatusEffect
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 5
          effectProto: StatusEffectDrunk
          time: 3.0
          type: Remove 
        - !type:Vomit
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              min: 20
          probability: 0.2
        - !type:PopupMessage
          type: Local
          conditions:
            - !type:ReagentCondition
              reagent: Methylxanthine
              max: 15
          visualType: Medium
          messages:
            - "methylxanthine-effect-awake"
            - "methylxanthine-effect-focus"
            - "methylxanthine-effect-attentive"
          probability: 0.2
        - !type:AdjustReagent
          conditions:
            - !type:MetabolizerTypeCondition
              type: [ Cyclorite ]
          reagent: Methylxanthine
          amount: -0.25
          
