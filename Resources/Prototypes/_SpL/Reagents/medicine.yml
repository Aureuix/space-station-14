- type: reagent
  id: Adraferromycadone
  group: Medicine
  name: reagent-name-adraferromycadone
  desc: reagent-desc-adraferromycadone
  physicalDesc: reagent-physical-desc-ferrous
  flavor: medicine
  color: "#d1e231"
  worksOnTheDead: true
  metabolisms:
    Medicine:
      metabolismRate: 1
      effects:
        - !type:ReduceRotting
          seconds: 10
          conditions:
          - !type:TemperatureCondition
            max: 150.0
          - !type:MobStateCondition
            mobstate: Dead
        - !type:HealthChange
          conditions:
          - !type:TemperatureCondition
            max: 150.0
          damage:
            types:
             Cellular: -4
             Caustic: 4

- type: reagent
  id: Scorizine
  group: Medicine
  name: reagent-name-scorizine
  desc: reagent-desc-scorizine
  physicalDesc: reagent-physical-desc-viscous
  flavor: beer
  color: "#a3d7d9"
  metabolisms:
    Medicine:
      metabolismRate: 0.25
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Avali, Resomi Vox ]
        damage:
          types:
            Heat: -2
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Avali, Resomi Vox ]
          inverted: true
        damage:
          types:
            Caustic: 2 #ammonia based, causes caustic burns
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Scorizine
          min: 20
        damage:
          types:
            Slash: 0.5
            Piercing: 0.5
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Scorizine
          min: 15
        probability: 0.1
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Scorizine
          min: 10
        emote: Cough
        probability: 0.2

- type: reagent
  id: Voltizol
  name: reagent-name-voltizol
  group: Medicine
  desc: reagent-desc-voltizol
  physicalDesc: reagent-physical-desc-elf-space-cleaner
  flavor: beer
  color: "#b3baa4"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      # heals shocks and removes shock chems
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Avali, Resomi, Vox ]
        damage:
          types:
            Shock: -2 # 4 per u
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition 
          type: [ Avali, Resomi, Vox ]
          inverted: true
        damage:
          types:
            Shock: 2 
            Caustic: 1 #SpectraLight: Avali poison again. see above. iron based chem.
      - !type:AdjustReagent
        reagent: Licoxide
        amount: -2
      - !type:AdjustReagent
        reagent:  Tazinide
        amount: -2
      # avali hotness device
      - !type:AdjustTemperature
        amount: 2500
      # od burns to death
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Voltizol
          min: 12
        damage:
          types:
            Heat: 2 # 4 per u
      - !type:AdjustTemperature
        conditions:
        - !type:ReagentCondition
          reagent: Voltizol
          min: 12
        amount: 30000
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Voltizol
          min: 12
      #Starlight Start
      - !type:ModifyStatusEffect
        effectProto: StatusEffectCyberneticDisruption
        conditions:
        - !type:ReagentCondition
          reagent: Voltizol
          min: 12
        type: Add
        time: 2
      - !type:ModifyStatusEffect
        effectProto: StatusEffectCyberneticDisruption
        conditions:
        - !type:MetabolizerTypeCondition 
          type: [ Avali, Resomi, Vox ]
          inverted: true
        type: Add
        time: 2
      # Starlight-End

- type: reagent
  id: Carbonate
  group: Medicine
  name: reagent-name-carbonate
  desc: reagent-desc-carbonate
  physicalDesc: reagent-physical-desc-powdery
  flavor: chalky
  color: "#e0e3da"

- type: reagent
  id: AmmoniaCarbonate
  group: Medicine
  name: reagent-name-ammoniacarbonate
  desc: reagent-desc-ammoniacarbonate
  physicalDesc: reagent-physical-desc-powdery
  flavor: horrible #this is smelling salts.
  color: "#eaede4"
  metabolisms:
    Medicine:
      effects:
      - !type:Jitter
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 30
        type: Remove
      - !type:ResetNarcolepsy
        conditions:
        - !type:ReagentCondition
          reagent: AmmoniaCarbonate
          min: 10
      - !type:PopupMessage
        visualType: Medium
        messages: ["ethyloxyephedrine-effect-feeling-awake", "ethyloxyephedrine-effect-clear-mind"]
        type: Local
        probability: 0.3

