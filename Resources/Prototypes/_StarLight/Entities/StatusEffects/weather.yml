- type: entity
  parent: WeatherBase
  id: WeatherRadStorm
  name: radstorm
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/Effects/weather.rsi
        state: aashfall_heavy
      color: green
      sound:
        path: /Audio/_Starlight/Effects/Weather/blobalarm.ogg
        params:
          loop: true
          volume: -10
    - type: WeatherEffects
    - type: WeatherEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Radiation: 1.5 # SpL

- type: entity
  parent: WeatherBase
  id: WeatherSolarFlare
  name: solar flare
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/Effects/weather.rsi
        state: ashfall_light
      color: yellow
      sound:
        path: /Audio/_Starlight/Effects/Weather/blobalarm.ogg
        params:
          loop: true
          volume: -16 # SpL
    - type: WeatherEffects
    - type: WeatherEntityEffect
      effects:
      #- !type:Flash # SpL
      - !type:Flammable
        multiplier: 3 # SpL
        multiplierOnExisting: 0.5
      - !type:Ignite
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Heat: 1 # SpL
      - !type:AdjustTemperature # SpL
        amount: 5500 # SpL

- type: entity
  parent: WeatherBase
  id: WeatherAuroraCaelus
  name: aurora caelus
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/_Starlight/Effects/weather.rsi
        state: starry_night
      sound:
        path: /Audio/_Starlight/Effects/Weather/aurora_caelus.ogg
        params:
          volume: 0
    - type: ParallaxStatusEffect
      parallax: AuroraCaelus

- type: entity
  parent: WeatherBase
  id: WeatherSpaceWhale
  name: space whale
  components:
    - type: ParallaxStatusEffect
      parallax: SpaceWhale

- type: entity
  parent: WeatherBase
  id: WeatherSpaceDog
  name: space dog
  components:
    - type: ParallaxStatusEffect
      parallax: SpaceDog


# a version of WeatherSnowfallHeavy with a LOT less fog
- type: entity
  parent: WeatherBase
  id: WeatherSnowfallLobster
  name: heavy snowfall with light fog
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/_Starlight/Effects/weather.rsi
        state: snowfall_lobster
      sound:
        path: /Audio/Effects/Weather/snowstorm.ogg
        params:
          loop: true
          volume: -12 # quiet ambience rather than in-your-face wind