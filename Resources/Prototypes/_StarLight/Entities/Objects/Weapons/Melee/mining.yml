- type: entity
  name: diamond pickaxe
  parent: Pickaxe
  id: PickaxeDiamond
  description: Sharp as a diamond, perfect for mining gibtonite.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/pickaxediamond.rsi
      state: pickaxediamond
    - type: MeleeWeapon
      attackRate: 1
      range: 1.7
      wideAnimationRotation: -135
      soundHit:
        path: "/Audio/Weapons/smash.ogg"
        params:
          volume: -3
      damage:
        types: # SpL start
          Piercing: 2
          Blunt: 2
          Slash: 2 # SpL end
    - type: IncreaseDamageOnWield
      damage:
        types:
          Piercing: 4 # SpL
          Blunt: 4 # SpL
          Slash: 4 # SpL
          Structural: 50
    - type: Item
      size: Normal
      shape:
        - 0,0,2,0
        - 1,1,1,2
      sprite: _Starlight/Objects/Weapons/Melee/pickaxediamond.rsi
      storedRotation: -45
    - type: PhysicalComposition
      materialComposition:
        Diamond: 100
        Wood: 100
