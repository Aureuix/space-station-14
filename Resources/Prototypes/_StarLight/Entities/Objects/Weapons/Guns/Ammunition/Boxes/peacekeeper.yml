- type: entity
  id: BasePeacekeeperBox
  name: grenade cartridge
  parent: [BaseItem, BaseSecurityContraband ]
  abstract: true
  components:
    - type: Tag
      tags:
        - MagazineGrenade
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - Grenade
      capacity: 4
    - type: Item
      size: Normal
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/peacekeeper.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
    - type: MagazineVisuals
      magState: mag
      steps: 3
      zeroVisible: false
    - type: Appearance

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperFlash
  name: Peacekeeper flash ammo box
  description: A box of flash grenades for the Peacekeeper, good for catching up to a running fiend or for dispersing crowds.
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeFlash
      mayTransfer: true
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
        - state: flash

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperStinger
  name: Peacekeeper stinger ammo box
  description: A box of stinger grenades for the Peacekeeper, very good at dispersing crowds and getting lawsuits.
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeStingerLauncher
      mayTransfer: true
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
        - state: stinger

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperGas
  name: Peacekeeper teargas ammo box
  description: A box of teargas grenades for the Peacekeeper. The label has a big "DO NOT FORGET INTERNALS" written in red.
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeGasLauncher
      mayTransfer: true
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
        - state: gas

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperBaton
  name: Peacekeeper baton ammo box
  description: A box of less-lethal baton grenades for the Peacekeeper. Do NOT forget that "less lethal" does NOT mean it can't still kill someone.
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeBaton
      mayTransfer: true
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
        - state: baton