- type: entity
  name: VL-119 SPKA # SpL
  id: WeaponSPKA
  parent: [WeaponProtoKineticAcceleratorBase, BaseSecuritySalvageMiningContraband] # SpL
  description: Fires a barrage of low-damage kinetic bolts at a short range. Designed as a self-defense advancement of the PKA specialised for close quarters operations. # SpL
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Guns/Basic/spka.rsi
      layers:
        - state: icon
    - type: Item
      sprite: _Starlight/Objects/Weapons/Guns/Basic/spka.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Guns/Basic/spka.rsi
      quickEquip: false
      slots:
        - suitStorage
        - Belt
    - type: UpgradeableGun
      whitelist:
        tags:
          - PKAUpgrade
    - type: ContainerContainer
      containers:
        upgrades: !type:Container
    - type: Gun
      projectileSpeed: 20
      fireRate: 2
      selectedMode: FullAuto
      angleDecay: 45
      minAngle: 21
      maxAngle: 32
      availableModes:
        - SemiAuto
        - FullAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
        params:
          pitch: 1.5
          variation: 0.12
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
        params:
          pitch: 1.8
          variation: 0.08
    - type: BasicEntityAmmoProvider
      proto: BulletKineticSub
      capacity: 8
      count: 8
    - type: CanDualWield
      dualWieldInaccuracyPenalty: 15
    - type: GunWieldBonus
      minAngle: -19
      maxAngle: -16

